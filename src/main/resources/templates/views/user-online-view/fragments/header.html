  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const emailCustomer = localStorage.getItem('tempEmail');
      const cartLoggedIn = document.getElementById('cartLoggedIn');
      const cartGuest = document.getElementById('cartGuest');

      function updateGuestCartQuantity() {
        const badge = document.getElementById('cart-count-badge-guest');
        let guestCart = JSON.parse(localStorage.getItem('noLoginCart')) || [];
        let quantity = 0;
        guestCart.forEach(item => {
          quantity += item.quantity || 0;
        });

        if (quantity > 0) {
          badge.textContent = quantity;
          badge.style.display = 'inline-block';
        } else {
          badge.style.display = 'none';
        }
      }

      if (emailCustomer && emailCustomer.trim() !== "") {
        cartLoggedIn.style.display = 'block';
        cartGuest.style.display = 'none';

        fetch('/cart/api/quantity')
                .then(res => res.ok ? res.json() : Promise.reject(res.statusText))
                .then(quantity => {
                  const badge = document.getElementById('cart-count-badge');
                  if (quantity > 0) {
                    badge.textContent = quantity;
                    badge.style.display = 'inline-block';
                  } else {
                    badge.style.display = 'none';
                  }
                })
                .catch(err => {
                  console.error('Error fetching logged-in cart quantity:', err);
                  const badge = document.getElementById('cart-count-badge');
                  badge.style.display = 'none';
                });

        localStorage.removeItem('noLoginCart');
      } else {
        cartLoggedIn.style.display = 'none';
        cartGuest.style.display = 'block';

        updateGuestCartQuantity();
      }
    });

  </script>
