<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Title</title>
</head>
<body>

<th:block th:fragment="headerFragment">
  <div class="header-wrap classicHeader animated d-flex">
    <div class="container-fluid">
      <div class="row align-items-center">
        <!--Desktop Logo-->
        <div class="logo col-md-2 col-lg-2 d-none d-lg-block">
          <a href="index.html">
            <img src="assets/user-online/images/logo1.svg" alt=""
                 title="Belle Multipurpose Html Template"/>
          </a>
        </div>
        <!--End Desktop Logo-->
        <div class="col-2 col-sm-3 col-md-3 col-lg-8">
          <div class="d-block d-lg-none">
            <button type="button" class="btn--link site-header__menu js-mobile-nav-toggle mobile-nav--open">
              <i class="icon anm anm-times-l"></i>
              <i class="anm anm-bars-r"></i>
            </button>
          </div>
          <!--Desktop Menu-->
          <nav class="grid__item" id="AccessibleNav"><!-- for mobile -->
            <ul id="siteNav" class="site-nav medium center hidearrow">
              <li class="lvl1 parent megamenu"><a th:href="@{/}">Trang chủ <i class="anm anm-angle-down-l"></i></a>
              </li>
              <li class="lvl1 parent megamenu"><a th:href="@{/shop}">Shop
                <i class="anm anm-angle-down-l"></i></a>
              </li>
              <li class="lvl1 parent megamenu"><a th:href="@{/shop}">Sản phẩm
                <i class="anm anm-angle-down-l"></i></a>
              </li>
              <li class="lvl1"><a th:href="@{/shop}"><b>Mua ngay!</b> <i class="anm anm-angle-down-l"></i></a>
              </li>
            </ul>
          </nav>
          <!--End Desktop Menu-->
        </div>
        <!--Mobile Logo-->
        <div class="col-6 col-sm-6 col-md-6 col-lg-2 d-block d-lg-none mobile-logo">
          <div class="logo">
            <a href="index.html">
              <img src="assets/user-online/images/logo.svg" alt="Belle Multipurpose Html Template"
                   title="Belle Multipurpose Html Template"/>
            </a>
          </div>
        </div>
        <!--Mobile Logo-->
        <div class="col-4 col-sm-3 col-md-3 col-lg-2 d-flex align-items-center justify-content-end">
          <div class="site-header__search" style="margin-left: 20px;">
            <a th:href="@{/searchBill}" class="search-trigger" title="Search">
              <i class="icon anm anm-search-l" style="color: black"></i>
            </a>
          </div>
          <div id="cartLoggedIn" class="site-cart" style="position: relative; display: none;">
            <a href="/cart" class="site-header__cart" title="Cart" style="position: relative; display: inline-block;">
              <i class="icon anm anm-bag-l" style="font-size: 24px;"></i>
              <span class="cart-count-badge"
                    th:if="${cartQuantity != null and cartQuantity > 0}"
                    th:text="${cartQuantity}"></span>
            </a>
          </div>

          <div id="cartGuest" class="site-cart" style="position: relative; display: none;">
            <a href="/NoLogin" class="site-header__cart" title="Cart" style="position: relative; display: inline-block;">
              <i class="icon anm anm-bag-l" style="font-size: 24px;"></i>
              <span class="cart-count-badge"></span>
            </a>
          </div>


        </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const emailCustomer = localStorage.getItem('tempEmail');
      const cartLoggedIn = document.getElementById('cartLoggedIn');
      const cartGuest = document.getElementById('cartGuest');

      console.log("Check emailCustomer:", emailCustomer);

      if (emailCustomer && emailCustomer.trim() !== "") {
        cartLoggedIn.style.display = 'block';
        cartGuest.style.display = 'none';
        localStorage.removeItem('noLoginCart')
      } else {
        cartLoggedIn.style.display = 'none';
        cartGuest.style.display = 'block';
      }
    });

  </script>
  <script type="text/javascript" th:src="@{/assets/js/cartNoLogin/header.js}"></script>
</th:block>
</body>

</html>
