<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/user-online-view/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin thanh toán</title>
    <th:block id="th-css">
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                /*padding: 20px;*/
                background-color: #f4f4f4;
            }

            h2 {
                text-align: center;
                margin-bottom: 30px;
            }

            .container {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 30px;
                margin-top: 60px;
            }

            .left, .right {
                flex: 1;
                padding: 20px;
                background-color: white;
                border-radius: 8px;
                box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            }

            .right {
                background-color: #dfeeff; /* Bạn có thể thay màu này */
            }

            .form-group {
                margin-bottom: 15px;
            }

            label {
                display: block;
                margin-bottom: 5px;
                font-weight: bold;
            }

            input, select {
                width: 100%;
                padding: 8px;
                border: 1px solid #ccc;
                border-radius: 4px;
            }

            .buttons {
                text-align: center;
                margin-top: 20px;
            }

            .buttons button {
                padding: 10px 20px;
                margin: 0 10px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
                font-size: 16px;
            }

            .cod-btn {
                background-color: #4CAF50;
                color: white;
            }

            .vnpay-btn {
                background-color: #007BFF;
                color: white;
            }
        </style>
    </th:block>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css" rel="stylesheet">

    <!-- JavaScript Toastr -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>

</head>
<body>
<th:block id="th-body">
    <div class="content-body">


        <h2 style="margin-top: 80px">Thông tin thanh toán</h2>

        <div class="container">
            <!-- Bên trái -->
            <div class="left">
                <div class="form-group">
                    <label for="nameCustomer">Họ và tên</label>
                    <input type="text" id="nameCustomer" name="nameCustomer">
                    <p id="nameCustomerError" style="color: red; display: none; margin-left: 3px"></p>
                </div>

                <div class="form-group">
                    <label for="numberPhoneCustomer">Số điện thoại</label>
                    <input type="text" id="numberPhoneCustomer" name="numberPhoneCustomer">
                    <p id="numberPhoneCustomerError" style="color: red; display: none;margin-left: 3px"></p>
                </div>
                <div class="form-group">
                    <label for="emailCustomer">Email</label>
                    <input type="text" id="emailCustomer" name="emailCustomer">
                    <p id="emailCustomerError" style="color: red; display: none;margin-left: 3px"></p>

                </div>
                <div class="form-group">
                    <label for="provinceSelect">Tỉnh / Thành phố</label>
                    <select id="provinceSelect" name="provinceSelect">
                        <option value="">Chọn tỉnh / thành phố</option>
                    </select>
                    <p id="provinceSelectError" style="color: red; display: none;margin-left: 3px"></p>

                </div>

                <div class="form-group">
                    <label for="districtSelect">Quận / Huyện</label>
                    <select id="districtSelect" name="districtSelect">
                        <option value="">Chọn quận / huyện</option>
                    </select>
                    <p id="districtSelectError" style="color: red; display: none;margin-left: 3px"></p>

                </div>

                <div class="form-group">
                    <label for="wardSelect">Xã / Phường</label>
                    <select id="wardSelect" name="wardSelect">
                        <option value="">Chọn xã / phường</option>
                    </select>
                    <p id="wardSelectError" style="color: red; display: none;margin-left: 3px"></p>
                </div>

                <div class="form-group">
                    <label for="addressValue">Địa chỉ cụ thể</label>
                    <input type="text" id="addressValue" name="addressValue">
                    <p id="addressValueError" style="color: red; display: none;margin-left: 3px"></p>
                </div>
                <div class="form-group">
                    <label for="note">Ghi chú</label>
                    <textarea id="note" name="note" rows="4" cols="50"></textarea>
                </div>
            </div>

            <!-- Bên phải -->
            <div class="right">
                <!-- Nội dung bên phải bạn có thể thêm sau -->
                <h4 style="text-align: center ; margin-top: 20px; padding: 10px">Thông tin sản phẩm mua </h4>
                <table id="checkout-table" style="margin-top: 40px; ">
                    <thead>
                    <tr>
                        <th>STT</th>
                        <th>Tên sản phẩm</th>
                        <th>Kích cỡ</th>
                        <th>Màu sắc</th>
                        <th>Số lượng</th>
                        <th>Đơn giá</th>
                        <th>Tổng tiền</th>
                    </tr>
                    </thead>
                    <tbody id="checkout-body">

                    </tbody>
                </table>
                <div style="margin-top: 20px; padding: 10px">
                    <p style="margin-top: 10px ; margin-bottom: 10px ; font-size: 18px ;text-transform: uppercase">Tổng
                        tiền hàng <span id="span-totalItem">VND</span></p>
                    <p style="margin-bottom: 10px;font-size: 18px ;text-transform: uppercase">Phí ship : <span
                            id="shipping">VND</span></p>
                    <p style="margin-bottom: 10px ; font-size: 18px ; text-transform: uppercase"> Giảm giá : <span
                            id="span-voucherValue"></span></p>
                    <p style="margin-bottom: 10px ; font-size: 18px;text-transform: uppercase">Tổng tiền thanh toán :
                        <span id="span-totalPayMent"></span></p>
                </div>
                <div>
                    <p style="margin-top: 10px ; margin-bottom: 10px ; font-size: 18px ;text-transform: uppercase">Ngày
                        nhận hàng <span id="confirm-day"></span></p>
                </div>
            </div>
        </div>

        <div class="buttons">
            <button class="cod-btn" id="cod-btn">Thanh toán khi nhận hàng</button>
            <button class="vnpay-btn" id="vnpay-btn">Thanh toán VNPAY</button>
        </div>

    </div>
</th:block>
</body>
<th:block id="th-js">
    <script th:src="@{/assets/user-online/js/vendor/jquery-3.3.1.min.js}"></script>
    <script type="text/javascript" th:src="@{/assets/js/cartNoLogin/buyNowNoLogin.js}"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.4/dist/sweetalert2.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.7.4/dist/sweetalert2.min.css">

</th:block>
</html>
