<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/user-online-view/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
    <meta charset="UTF-8">
    <title>Index user</title>
    <th:block id="th-css">
        <link rel="stylesheet" th:href="@{/assets/user-online/css/plugins.css}">
    </th:block>
</head>
<body>

<th:block id="th-body">
    <!--Body Content-->
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>
    <div id="page-content">
        <!--Page Title-->
        <div class="page section-header text-center mt-5">
            <div class="page-title">
                <div class="wrapper"><h1 class="page-width">Đổi mật khẩu</h1></div>
            </div>
        </div>
        <!--End Page Title-->

        <div class="container">
            <div class="row billing-fields">
                <div class="col-md-2 mb-4 wrapper">
                    <div class="create-ac-content bg-light-gray padding-20px-all d-flex flex-column gap-2">
                        <div class="p-4 text-center border-b">
                            <img th:src="${loggedUser.avatar}" class="rounded-full mx-auto mb-2" style="width: 80px; height: 80px; object-fit: cover;" />
                            <p class="font-bold" th:text="${loggedUser.fullName}"></p>
                        </div>
                        <button class="tab-btn w-100 text-start">
                            <i ></i><a th:href="@{/online/customer/profile}">Hồ sơ của tôi</a>
                        </button>
                        <button class="tab-btn w-100 text-start">
                            <i ></i><a th:href="@{/auth/change/online}">Đổi mật khẩu</a>
                        </button>
                        <button class="tab-btn w-100 text-start">
                            <i></i><a th:href="@{/bill}">Lịch sử đơn hàng</a>
                        </button>
                        <button>
                            <i></i><a th:href="@{/auth/logout}">Đăng xuất</a>
                        </button>
                    </div>
                </div>
                <div class="col-md-4 offset-md-2">
                    <form th:action="@{/auth/change/online}" method="post">
                        <!-- Mật khẩu hiện tại -->
                        <div class="form-group">
                            <label class="text-label">Mật khẩu hiện tại</label>
                            <div class="input-group transparent-append">
                                <div class="input-group-prepend">
                                    <span class="input-group-text text-black"><i class="fa fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" name="currentPassword" placeholder=""
                                       th:value="${currentPassword}">
                                <div class="input-group-append show-pass">
                                    <span class="input-group-text text-black toggle-password" style="cursor: pointer;"><i class="fa fa-eye-slash"></i></span>
                                </div>
                            </div>
                            <p class="text-danger" th:if="${errors['currentPassword']}" th:text="${errors['currentPassword']}"></p>
                        </div>

                        <!-- Mật khẩu mới -->
                        <div class="form-group">
                            <label class="text-label">Mật khẩu mới</label>
                            <div class="input-group transparent-append">
                                <div class="input-group-prepend">
                                    <span class="input-group-text text-black"><i class="fa fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" name="newPassword" placeholder=""
                                       th:value="${newPassword}">
                                <div class="input-group-append show-pass">
                                    <span class="input-group-text text-black toggle-password" style="cursor: pointer;"><i class="fa fa-eye-slash"></i></span>
                                </div>
                            </div>
                            <p class="text-danger" th:if="${errors['newPassword']}" th:text="${errors['newPassword']}"></p>
                        </div>

                        <!-- Xác nhận mật khẩu mới -->
                        <div class="form-group">
                            <label class="text-label">Xác nhận mật khẩu mới</label>
                            <div class="input-group transparent-append">
                                <div class="input-group-prepend">
                                    <span class="input-group-text text-black"><i class="fa fa-lock"></i></span>
                                </div>
                                <input type="password" class="form-control" name="confirmPassword" placeholder=""
                                       th:value="${confirmPassword}">
                                <div class="input-group-append show-pass">
                                    <span class="input-group-text text-black toggle-password" style="cursor: pointer;"><i class="fa fa-eye-slash"></i></span>
                                </div>
                            </div>
                            <p class="text-danger" th:if="${errors['confirmPassword']}" th:text="${errors['confirmPassword']}"></p>
                        </div>

                        <!-- Submit -->
                        <div class="text-center mt-3">
                            <button type="submit" class="btn btn-primary btn-block">Đổi mật khẩu</button>
                        </div>
                    </form>

                </div>
            </div>
        </div>

    </div>
    <!--End Body Content-->

    <!--Scoll Top-->
    <span id="site-scroll"><i class="icon anm anm-angle-up-r"></i></span>
    <!--End Scoll Top-->

</th:block>

</body>
<script>
</script>
<th:block id="th-js">
    <script>
        document.querySelectorAll('.toggle-password').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const input = this.closest('.input-group').querySelector('input');
                const icon = this.querySelector('i');

                if (input.type === "password") {
                    input.type = "text";
                    icon.classList.remove("fa-eye-slash");
                    icon.classList.add("fa-eye");
                } else {
                    input.type = "password";
                    icon.classList.remove("fa-eye");
                    icon.classList.add("fa-eye-slash");
                }
            });
        });
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script>
        function showToast(message) {
            const toastContainer = document.getElementById("toast-container");
            const toast = document.createElement("div");

            toast.innerHTML = `<i class="fas fa-check-circle" style="color: #28a745; margin-right: 10px;"></i> ${message}`;
            toast.style.cssText = `
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.5s, transform 0.5s ease-in-out;
            margin-bottom: 10px;
            position: relative;
            min-width: 280px;
        `;

            toastContainer.appendChild(toast);

            // Hiện thông báo (trượt từ phải vào)
            setTimeout(() => {
                toast.style.opacity = "1";
                toast.style.transform = "translateX(0)";
            }, 100);

            // Ẩn sau 3 giây (trượt ra phải)
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(100%)";
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // Hiển thị thông báo nếu có từ server
        document.addEventListener("DOMContentLoaded", function () {
            let successMessage = "[[${successMessage}]]";
            if (successMessage && successMessage.trim() !== "") {
                showToast(successMessage);
            }
        });
    </script>
</th:block>
</html>
