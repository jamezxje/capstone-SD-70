<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/root_layout::rootLayoutFragment(~{::#th-css}, null, ~{::#th-body})}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login Page</title>
    <th:block id="th-css">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/admin-dashboard/images/favicon.png">
        <link th:href="@{/assets/admin-dashboard/vendor/bootstrap-select/dist/css/bootstrap-select.min.css}"
              rel="stylesheet">
        <link th:href="@{/assets/admin-dashboard/css/style.css}" rel="stylesheet">
    </th:block>
</head>
<body>

<th:block id="th-body">
    <div class="vh-100">
        <div class="authincation h-100">
            <div class="container h-100">
                <div class="row justify-content-center h-100 align-items-center">
                    <div class="col-md-6">
                        <div class="authincation-content">
                            <div class="row no-gutters">
                                <div class="col-xl-12">
                                    <div class="auth-form">
                                        <div class="text-center mb-3">
                                            <img src="/assets/admin-dashboard/images/logo-full.png" alt="">
                                        </div>
                                        <h4 class="text-center mb-4">Đăng ký tài khoản</h4>
                                        <form th:action="@{/auth/register/save}" method="post" th:object="${userRegister}">
                                            <div class="form-group">
                                                <label class="text-label">Họ và tên</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text bg-primary text-white"> <i class="fa fa-user"></i> </span>
                                                    </div>
                                                    <input type="text" class="form-control" th:field="*{fullName}" placeholder="Nhập họ và tên...">
                                                </div>
                                                <p class="error" th:if="${errors['fullName']}" th:text="${errors['fullName']}" th:classappend="text-danger"></p>
                                            </div>
                                            <div class="form-group">
                                                <label class="text-label">Email</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend ">
                                                        <span class="input-group-text bg-primary text-white"><i class="fa fa-envelope"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" th:field="*{email}" placeholder="Nhập email...">
                                                </div>
                                                <p class="error" th:if="${errors['email']}" th:text="${errors['email']}" th:classappend="text-danger"></p>
                                            </div>
                                            <div class="form-group">
                                                <label class="text-label">Số điện thoại</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text bg-primary text-white"><i class="fa fa-envelope"></i></span>
                                                    </div>
                                                    <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Nhập số điện thoại...">
                                                </div>
                                                <p class="error" th:if="${errors['phoneNumber']}" th:text="${errors['phoneNumber']}" th:classappend="text-danger"></p>
                                            </div>
                                            <div class="form-group">
                                                <label class="text-label">Mật khẩu *</label>
                                                <div class="input-group transparent-append">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text bg-primary text-white"> <i class="fa fa-lock"></i> </span>
                                                    </div>
                                                    <input type="password" th:field="*{password}" class="form-control" id="dz-password" name="val-password" placeholder="Nhập mật khẩu...">
                                                    <div class="input-group-append show-pass ">
                                                    <span class="input-group-text bg-primary text-white">
														<i class="fa fa-eye-slash"></i>
														<i class="fa fa-eye"></i>
                                                    </span>
                                                    </div>
                                                </div>
                                                <p class="error" th:if="${errors['password']}" th:text="${errors['password']}" th:classappend="text-danger"></p>
                                            </div>

                                            <div class="text-center mt-4">
                                                <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
                                            </div>
                                        </form>
                                        <div class="new-account mt-3">
                                            <p>Bạn đã có tài khoản? <a class="text-primary" th:href="@{/auth/login}">Đăng nhập</a></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>
</body>
</html>
