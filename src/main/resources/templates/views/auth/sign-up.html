<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/layout/root_layout::rootLayoutFragment(~{::#th-css}, null, ~{::#th-body})}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login Page</title>
    <th:block id="th-css">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/images/favicon.png">
        <link th:href="@{/assets/vendor/bootstrap-select/dist/css/bootstrap-select.min.css}" rel="stylesheet">
        <link th:href="@{/assets/css/style.css}" rel="stylesheet">
    </th:block>
</head>
<body>

<th:block id="th-body">
    <div class="vh-100">
        <div class="authincation h-100">
    <div class="container h-100">
        <div class="row justify-content-center h-100 align-items-center">
            <div class="col-md-6">
                <div class="authincation-content">
                    <div class="row no-gutters">
                        <div class="col-xl-12">
                            <div class="auth-form">
                                <div class="text-center mb-3">
                                    <img src="/assets/images/logo-full.png" alt="Logo">
                                </div>
                                <h4 class="text-center mb-4">Đăng ký tài khoản</h4>
                                <form th:action="@{/auth/register/save}" method="post" th:object="${registerDTO}">
                                    <div class="form-group">
                                        <label class="mb-1"><strong>Họ và tên</strong></label>
                                        <input type="text" class="form-control" th:field="*{fullName}" placeholder="Họ và tên">
                                        <p class="text-danger" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></p>
                                    </div>
                                    <div class="form-group">
                                        <label class="mb-1"><strong>Email</strong></label>
                                        <input type="email" class="form-control" th:field="*{email}" placeholder="Email">
                                        <p class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                                    </div>
                                    <div class="form-group">
                                        <label class="mb-1"><strong>Số điện thoại</strong></label>
                                        <input type="text" class="form-control" th:field="*{phoneNumber}" placeholder="Số điện thoại">
                                        <p class="text-danger" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></p>
                                    </div>
                                    <div class="form-group">
                                        <label class="mb-1"><strong>Mật khẩu</strong></label>
                                        <input type="password" class="form-control" th:field="*{password}" placeholder="Mật khẩu">
                                        <p class="text-danger" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>
                                    </div>
                                    <div class="text-center mt-4">
                                        <button type="submit" class="btn btn-primary btn-block">Đăng ký</button>
                                    </div>
                                </form>
                                <div class="new-account mt-3">
                                    <p>Bạn đã có tài khoản? <a class="text-primary" th:href="@{/auth/login}">Đăng nhập</a></p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>
</th:block>

</body>
</html>
