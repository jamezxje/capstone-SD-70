<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/root_layout::rootLayoutFragment(~{::#th-css}, null, ~{::#th-body})}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Login Page</title>
  <th:block id="th-css">
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/admin-dashboard/images/favicon.png">
    <link th:href="@{/assets/admin-dashboard/vendor/bootstrap-select/dist/css/bootstrap-select.min.css}"
          rel="stylesheet">
    <link th:href="@{/assets/admin-dashboard/css/style.css}" rel="stylesheet">
  </th:block>
</head>
<body>
<th:block id="th-body">
  <div class="vh-100">
    <div class="authincation h-100">
      <div class="container h-100">
        <div class="row justify-content-center h-100 align-items-center">
          <div class="col-md-6">
            <div class="authincation-content">
              <div class="row no-gutters">
                <div class="col-xl-12">
                  <div class="auth-form">
                    <div class="text-center mb-3">
                      <img src="/assets/admin-dashboard/images/logo-full.png" alt="">
                    </div>
                    <h4 class="text-center mb-4">Quyên mật khẩu</h4>
                    <form th:action="@{/auth/forgot-password/save}" method="post">
                      <!-- Hiển thị thông báo lỗi -->
                      <div th:if="${error}" class="text-danger mt-2">
                        <p th:text="${error}"></p>
                      </div>
                      <div class="form-group">
                        <label><strong>Email</strong></label>
                        <input type="text" class="form-control" name="email" placeholder="Nhập email...">
                      </div>
                      <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-block">Gửi</button>
                      </div>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</th:block>
</body>
</html>
