<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/user-online-view/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Hóa đơn</title>
    <th:block id="th-css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
        <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
        <link href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/css/toastr.min.css" rel="stylesheet">
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/js/toastr.min.js"></script>
        <style>


            .search-container {
                text-align: center;
                background: #fff;
                padding: 30px;
                border-radius: 10px;
                /*box-shadow: 0 4px 8px rgba(0,0,0,0.1);*/
                margin: 150px 0 0 0;
            }

            img , svg {
                width: 500px;
                margin-left: 40px;
            }
            input[type="text"] {
                width: 300px;
                padding: 10px;
                margin-right: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .btn-search {
                padding: 10px 20px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .form-wrapper {
                display: flex;
                align-items: flex-start; /* hoặc center nếu bạn muốn căn giữa theo chiều dọc */
                justify-content: center;
                gap: 40px;
                margin-top: 30px;
                margin-left: 400px;
            }

            .input-group {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                margin-top: 75px;
            }

            h2 {
    margin-bottom: 30px;
}
            button:hover {
                background-color: #218838;
            }
        </style>
    </th:block>
</head>

<body>
<th:block id="th-body" >
<div class="content-body">
    <div class="search-container">
        <h2>Tìm kiếm hóa đơn</h2>
        <div class="form-wrapper">
            <img src="https://atpro.com.vn/wp-content/uploads/2024/02/10-dieu-can-biet-khi-gui-hang-qua-giao-hang-nhanh10.jpeg">
            <div class="input-group">
                <input type="text" name="mahoadon" placeholder="Nhập mã hóa đơn..." required id="maHoaDon">
                <button  class="btn-search" id="btn-search">Tìm kiếm</button>
            </div>
        </div>
    </div>
</div>
</th:block>

</body>
<th:block id="th-js">
    <script type="text/javascript" th:src="@{/assets/js/searchBillForCustomer/search.js}"></script>
</th:block>
</html>
