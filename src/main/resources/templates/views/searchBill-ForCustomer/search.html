<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/user-online-view/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Hóa đơn</title>
    <th:block id="th-css">
        <style>
            .search-container {
                text-align: center;
                background: #fff;
                padding: 30px;
                border-radius: 10px;
                /*box-shadow: 0 4px 8px rgba(0,0,0,0.1);*/
                margin: 150px 0 0 0;
            }

            img {
                width: 500px;
                margin-left: 40px;
            }
            input[type="text"] {
                width: 300px;
                padding: 10px;
                margin-right: 10px;
                border: 1px solid #ccc;
                border-radius: 5px;
            }

            .btn-search {
                padding: 10px 20px;
                background-color: #28a745;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .form-wrapper {
                display: flex;
                align-items: flex-start; /* hoặc center nếu bạn muốn căn giữa theo chiều dọc */
                justify-content: center;
                gap: 40px;
                margin-top: 30px;
                margin-left: 400px;
            }

            .input-group {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
                margin-top: 75px;
            }

            h2 {
                margin-bottom: 20px;
            }

            button:hover {
                background-color: #218838;
            }
        </style>
    </th:block>
</head>

<body>
<th:block id="th-body" >
<div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 1000;"></div>
<div class="content-body">
    <div class="search-container">
        <h2>Tìm kiếm hóa đơn</h2>
        <div class="form-wrapper">
            <img src="https://atpro.com.vn/wp-content/uploads/2024/02/10-dieu-can-biet-khi-gui-hang-qua-giao-hang-nhanh10.jpeg">
            <div class="input-group">
                <input type="text" name="mahoadon" placeholder="Nhập mã hóa đơn..." required id="maHoaDon">
                <button  class="btn-search" id="btn-search">Tìm kiếm</button>
            </div>
        </div>
    </div>
</div>
</th:block>

</body>
<th:block id="th-js">
    <script type="text/javascript" th:src="@{/assets/js/searchBillForCustomer/search.js}"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script>
        function showToast(message, type = "success", duration = 3000) {
            const toastContainer = document.getElementById("toast-container");
            const toast = document.createElement("div");

            // Cấu hình theo loại
            let bgColor, textColor, borderColor, icon;

            if (type === "success") {
                bgColor = "#d4edda";
                textColor = "#155724";
                borderColor = "#28a745";
                icon = `<i class="fas fa-check-circle" style="color: #28a745; margin-right: 10px;"></i>`;
            } else {
                bgColor = "#fff3cd";
                textColor = "#856404";
                borderColor = "#ffc107";
                icon = `<i class="fas fa-exclamation-triangle" style="color: #ffc107; margin-right: 10px;"></i>`;
            }

            // Phần thân toast
            toast.innerHTML = `
      <div style="display: flex; align-items: center;">${icon}<span>${message}</span></div>
      <div class="toast-progress-bar"></div>
    `;

            toast.style.cssText = `
      background-color: ${bgColor};
      color: ${textColor};
      border-left: 5px solid ${borderColor};
      padding: 12px 20px 6px 20px;
      font-size: 16px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      opacity: 0;
      transform: translateX(100%);
      transition: opacity 0.5s, transform 0.5s ease-in-out;
      margin-bottom: 10px;
      position: relative;
      min-width: 280px;
    `;

            // Thanh thời gian
            const progressBarStyle = document.createElement("style");
            progressBarStyle.innerHTML = `
      .toast-progress-bar {
        height: 4px;
        background-color: ${borderColor};
        width: 100%;
        animation: progress ${duration}ms linear forwards;
        border-radius: 0 0 5px 5px;
        margin-top: 8px;
      }
      @keyframes progress {
        from { width: 100%; }
        to { width: 0%; }
      }
    `;
            document.head.appendChild(progressBarStyle);

            toastContainer.appendChild(toast);

            // Animate in
            setTimeout(() => {
                toast.style.opacity = "1";
                toast.style.transform = "translateX(0)";
            }, 100);

            // Animate out and remove
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(100%)";
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }
    </script>
</th:block>
</html>
