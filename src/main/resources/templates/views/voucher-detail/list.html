<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">

<head>
  <meta charset="utf-8">
  <th:block id="th-css">
  </th:block>

</head>

<body>
<th:block id="th-body">
  <div class="content-body">
    <div class="container-fluid">
      <div class="card">
        <div class="card-header d-sm-flex d-block">
          <div class="mr-auto mb-sm-0 mb-3">
            <h4 class="card-title mb-2">Danh sách Voucher</h4>
          </div>
          <div class="input-group search-area right d-lg-inline-flex d-none">
            <input type="text" class="form-control" placeholder="Tìm kiếm...">
            <div class="input-group-append">
									<span class="input-group-text">
										<a href="javascript:void(0)">
											<i class="flaticon-381-search-2"></i>
										</a>
									</span>
            </div>
          </div>
<!--          <a th:href="@{/dashboard/product-management/voucher-detail/create}" class="btn btn-info">+ Thêm voucher chi tiết</a>-->
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-bordered" id="ListDatatableView">
              <thead>
              <tr>
                <th>#</th>
                <th>Bill Id</th>
                <th>Voucher Id</th>
                <th>Giá Trước</th>
                <th>Giá Sau</th>
                <th>Giá Tổng</th>
                <th>Ngày tạo</th>
                <th>Được tạo bởi</th>
                <th>Được cập nhật bởi</th>
                <th>ACTION</th>

              </tr>
              </thead>
              <tbody>
              <tr th:each="v : ${voucherDetails}">
                <td
                 th:text="${v.id}">
                </td>
                <td
              th:text="${v.bill.id}">
                </td>
                <td
              th:text="${v.voucher.id}">
                </td>
                <td>
                  <div
                  class="text-primary" th:text="${v.beforePrice}">
                  </div>
                </td>
                <td>
                  <div th:text="${v.afterPrice}"></div>
                </td>
                <td th:text="${v.discountPrice}"></td>
                <td>
                  <div
                     class="text-primary" th:text="${v.createDate}">
                  </div>
                </td>
                <td>
                  <div
                   th:text="${v.createdBy}">
                  </div>
                </td>

                <td>
                  <div>
                   <span th:text="${v.updatedBy}">
                  </div>

                </td>

                <td>
                  <div class="d-flex action-button">
<!--                    <a th:href="@{/dashboard/product-management/voucher-detail/{id}(id=${v.id})}" class="btn btn-info btn-xs light px-2">-->
<!--                      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">-->
<!--                        <path d="M17 3C17.2626 2.73735 17.5744 2.52901 17.9176 2.38687C18.2608 2.24473 18.6286 2.17157 19 2.17157C19.3714 2.17157 19.7392 2.24473 20.0824 2.38687C20.4256 2.52901 20.7374 2.73735 21 3C21.2626 3.26264 21.471 3.57444 21.6131 3.9176C21.7553 4.26077 21.8284 4.62856 21.8284 5C21.8284 5.37143 21.7553 5.73923 21.6131 6.08239C21.471 6.42555 21.2626 6.73735 21 7L7.5 20.5L2 22L3.5 16.5L17 3Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>-->
<!--                      </svg>-->
<!--                    </a>-->
                    <a href="javascript:void(0);" class="ml-2 btn btn-xs px-2 light btn-danger">
                      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M3 6H5H21" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                        <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                      </svg>

                    </a>

                  </div>
                </td>
              </tr>

              </tbody>
            </table>
          </div>

        </div>
      </div>
    </div>
  </div>
</th:block>
</body>


</html>
