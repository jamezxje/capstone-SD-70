<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý khách hàng</title>
    <th:block id="th-css"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<th:block id="th-body">
    <div class="content-body">
        <div class="container-fluid">
            <div class="row">
                <div class="col-lg-12">
                    <div class="card">
                        <div class="card-header">
                            <h4 class="card-title">Thêm khách hàng</h4>
                        </div>
                        <div class="card-body">
                            <div class="form-validation">
                                <form class="form-valide"
                                      method="post"
                                      th:action="@{/customer-management/add}"
                                      enctype="multipart/form-data">
                                    <div class="row">
                                        <div class="col-xl-6">
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="fullName">Họ và tên</label>
                                                <div class="col-lg-6">
                                                    <input type="text" class="form-control" id="fullName" th:field="*{customer.fullName}" placeholder="Nhập họ và tên...">
                                                    <span th:if="${#fields.hasErrors('customer.fullName')}" th:errorclass="text-danger" th:errors="*{customer.fullName}"></span>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="email">Email</label>
                                                <div class="col-lg-6">
                                                    <input type="email" class="form-control" id="email" th:field="*{customer.email}" placeholder="Nhập email...">
                                                    <p th:if="${#fields.hasErrors('customer.email')}" th:errorclass="text-danger" th:errors="*{customer.email}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="phoneNumber">Số điện thoại</label>
                                                <div class="col-lg-6">
                                                    <input type="text" class="form-control" id="phoneNumber" th:field="*{customer.phoneNumber}" placeholder="Nhập số điện thoại...">
                                                    <p th:if="${#fields.hasErrors('customer.phoneNumber')}" th:errorclass="text-danger" th:errors="*{customer.phoneNumber}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="dateOfBirth">Ngày sinh</label>
                                                <div class="col-lg-6">
                                                    <input type="date" class="form-control" id="dateOfBirth" th:field="*{customer.dateOfBirth}" min="1944-01-01" max="2006-12-31">
                                                    <p th:if="${#fields.hasErrors('customer.dateOfBirth')}" th:errorclass="text-danger" th:errors="*{customer.dateOfBirth}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Giới tính</label>
                                                <div class="col-lg-6">
                                                    <div class="mt-2">
                                                        <label class="radio-inline mr-3">
                                                            <input type="radio" th:field="*{customer.gender}" value="true"> Nam
                                                        </label>
                                                        <label class="radio-inline mr-3">
                                                            <input type="radio" th:field="*{customer.gender}" value="false"> Nữ
                                                        </label>
                                                    </div>
                                                    <div>
                                                        <p th:if="${#fields.hasErrors('customer.gender')}" class="text-danger mt-1" th:errors="*{customer.gender}"></p>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="roles">Vai trò</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" id="roles" th:field="*{customer.roles}">
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_CUSTOMER}">Khách hàng</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="col-xl-6">
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Tỉnh/Thành Phố</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" id="provinceSelect" th:field="*{address.provinceId}" name="provinceId">
                                                        <option value="">Chọn</option>
                                                    </select>
                                                    <input type="hidden" id="provinceName" th:field="*{address.province}" name="province">
                                                    <p th:if="${#fields.hasErrors('address.provinceId')}" th:errorclass="text-danger" th:errors="*{address.provinceId}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Quận/Huyện</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" id="districtSelect" th:field="*{address.toDistrictId}" name="toDistrictId">
                                                        <option value="">Chọn</option>
                                                    </select>
                                                    <input type="hidden" id="districtName" th:field="*{address.district}" name="district">
                                                    <p th:if="${#fields.hasErrors('address.toDistrictId')}" th:errorclass="text-danger" th:errors="*{address.toDistrictId}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Xã/Phường</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" id="wardSelect" th:field="*{address.wardCode}" name="wardCode">
                                                        <option value="">Chọn</option>
                                                    </select>
                                                    <input type="hidden" id="wardName" th:field="*{address.ward}" name="ward">
                                                    <p th:if="${#fields.hasErrors('address.wardCode')}" th:errorclass="text-danger" th:errors="*{address.wardCode}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Số nhà/Ngõ/Đường</label>
                                                <div class="col-lg-6">
                                                    <input type="text" class="form-control" th:field="*{address.line}" name="line" placeholder="Nhập địa chỉ cụ thể...">
                                                    <p th:if="${#fields.hasErrors('address.line')}" th:errorclass="text-danger" th:errors="*{address.line}"></p>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Trạng thái</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" th:field="*{customer.status}" >
                                                        <option th:value="ACTIVATED">Kích hoạt</option>
                                                    </select>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                    <div style="text-align: right; margin-top: 20px">
                                        <a class="btn btn-primary mr-2" href="/customer-management">Hủy</a>
                                        <button type="submit" class="btn btn-primary">Thêm khách hàng</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const tokenApiGHN = '7d67a984-b5fe-11ef-b166-4205c1d15e61';
        const urlProvince = 'https://online-gateway.ghn.vn/shiip/public-api/master-data/province';
        const urlDistricts = 'https://online-gateway.ghn.vn/shiip/public-api/master-data/district';
        const urlWard = 'https://online-gateway.ghn.vn/shiip/public-api/master-data/ward';

        function fetchAllProvinces() {
            axios.get(urlProvince, { headers: { token: tokenApiGHN } })
                .then(response => {
                    const selectElement = document.getElementById('provinceSelect');
                    selectElement.innerHTML = '<option value="">Chọn tỉnh</option>';
                    response.data.data.forEach(province => {
                        const option = new Option(province.ProvinceName, province.ProvinceID);
                        selectElement.add(option);
                    });

                    // Nếu có dữ liệu sẵn, chọn lại tỉnh
                    const selectedProvince = selectElement.getAttribute("data-value");
                    if (selectedProvince) {
                        selectElement.value = selectedProvince;
                        fetchDistricts(selectedProvince);
                    }
                })
                .catch(error => console.error('Lỗi lấy tỉnh:', error));
        }

        function fetchDistricts(provinceId) {
            axios.get(urlDistricts, { params: { province_id: provinceId }, headers: { token: tokenApiGHN } })
                .then(response => {
                    const districtSelect = document.getElementById('districtSelect');
                    districtSelect.innerHTML = '<option value="">Chọn huyện</option>';
                    response.data.data.forEach(district => {
                        const option = new Option(district.DistrictName, district.DistrictID);
                        districtSelect.add(option);
                    });

                    // Nếu có dữ liệu sẵn, chọn lại huyện
                    const selectedDistrict = districtSelect.getAttribute("data-value");
                    if (selectedDistrict) {
                        districtSelect.value = selectedDistrict;
                        fetchWards(selectedDistrict);
                    }
                })
                .catch(error => console.log("Lỗi lấy huyện:", error));
        }

        function fetchWards(districtId) {
            axios.get(urlWard, { params: { district_id: districtId }, headers: { token: tokenApiGHN } })
                .then(response => {
                    const wardSelect = document.getElementById('wardSelect');
                    wardSelect.innerHTML = '<option value="">Chọn xã</option>';
                    response.data.data.forEach(ward => {
                        const option = new Option(ward.WardName, ward.WardCode);
                        wardSelect.add(option);
                    });

                    // Nếu có dữ liệu sẵn, chọn lại xã
                    const selectedWard = wardSelect.getAttribute("data-value");
                    if (selectedWard) {
                        wardSelect.value = selectedWard;
                    }
                })
                .catch(error => console.log("Lỗi lấy xã:", error));
        }

        // Cập nhật khi chọn tỉnh
        document.getElementById('provinceSelect').addEventListener('change', function () {
            const provinceId = this.value;
            document.getElementById('provinceName').value = this.options[this.selectedIndex].text;
            document.getElementById('districtSelect').innerHTML = '<option value="">Chọn huyện</option>';
            document.getElementById('wardSelect').innerHTML = '<option value="">Chọn xã</option>';
            if (provinceId) fetchDistricts(provinceId);
        });

        // Cập nhật khi chọn huyện
        document.getElementById('districtSelect').addEventListener('change', function () {
            const districtId = this.value;
            document.getElementById('districtName').value = this.options[this.selectedIndex].text;
            document.getElementById('wardSelect').innerHTML = '<option value="">Chọn xã</option>';
            if (districtId) fetchWards(districtId);
        });

        // Cập nhật khi chọn xã
        document.getElementById('wardSelect').addEventListener('change', function () {
            document.getElementById('wardName').value = this.options[this.selectedIndex].text;
        });

        fetchAllProvinces();
    });
</script>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const avatarPreview = document.getElementById("avatarPreview");
        const modalPreviewImage = document.getElementById("modalPreviewImage");
        const viewAvatarBtn = document.getElementById("viewAvatarBtn");
        const deleteAvatarBtn = document.getElementById("deleteAvatarBtn");
        const chooseAvatarBtn = document.getElementById("chooseAvatarBtn");
        const avatarInput = document.getElementById("avatarInput");
        const deleteAvatarFlag = document.getElementById("deleteAvatarFlag");
        const avatarFileName = document.getElementById("avatarFileName");

        // Ẩn/hiện nút tùy theo trạng thái ảnh
        function updateButtonVisibility() {
            const hasImage = avatarPreview.src && avatarPreview.src !== window.location.href;
            avatarPreview.style.display = hasImage ? "block" : "none";
            viewAvatarBtn.style.display = hasImage ? "inline-block" : "none";
            deleteAvatarBtn.style.display = hasImage ? "inline-block" : "none";
            chooseAvatarBtn.style.display = hasImage ? "none" : "inline-block";
        }
        updateButtonVisibility();

        // Xem ảnh trong modal
        viewAvatarBtn.addEventListener("click", function () {
            modalPreviewImage.src = avatarPreview.src;
            document.getElementById("imageName").textContent = avatarFileName.value || avatarPreview.src.split("/").pop();
        });

        // Xóa ảnh
        deleteAvatarBtn.addEventListener("click", function () {
            avatarPreview.src = "";
            avatarFileName.value = "";
            deleteAvatarFlag.value = "true";
            updateButtonVisibility();
        });

        // Xem trước ảnh khi chọn file
        avatarInput.addEventListener("change", function () {
            const file = avatarInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    avatarPreview.src = e.target.result;
                    avatarFileName.value = file.name; // Giữ nguyên tên file
                    deleteAvatarFlag.value = "false";
                    updateButtonVisibility();
                };
                reader.readAsDataURL(file);
            }
        });

        // Mở modal xem ảnh
        document.querySelector("[data-target='#previewModal']").addEventListener("click", function () {
            modalPreviewImage.src = avatarPreview.src;
            document.getElementById("imageName").textContent = avatarFileName.value || avatarPreview.src.split("/").pop();
        });
    });
</script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</th:block>
</body>
</html>
