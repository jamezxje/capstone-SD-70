<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{views/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
	<meta charset="UTF-8">
	<title>Quản lý khách hàng</title>
	<th:block id="th-css"></th:block>
</head>
<body>
<th:block id="th-body">
	<div class="content-body">
		<div class="container-fluid">
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">Khách hàng Chi Tiết</h4>
							<div>
								<a href="/customer-management" class="btn btn-primary mr-2">Quay lại</a>
								<!--<button type="submit" class="btn btn-primary">Lưu</button>-->
							</div>
						</div>
						<div class="card-body">
							<div class="form-validation">
								<form class="form-valide" method="post">
									<div class="row">
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">ID khách hàng</label>
												<div class="col-lg-6">
													<input th:value="${customer.id}" type="text" readonly=""  class="form-control"placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">Họ và tên</label>
												<div class="col-lg-6">
													<input th:value="${customer?.fullName ?: ''}" type="text" readonly=""  class="form-control" id="val-username" name="val-username" placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-email">Email
												</label>
												<div class="col-lg-6">
													<input th:value="${customer?.email ?: ''}" type="text" readonly="" class="form-control" id="val-email" name="val-email" placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Số điện thoại
												</label>
												<div class="col-lg-6">
													<input th:value="${customer?.phoneNumber ?: ''}" type="text" readonly="" class="form-control" id="val-sodienthoai" name="val-sodienthoai" placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Ngày sinh
												</label>
												<div class="col-lg-6">
													<input type="date" class="form-control" readonly  th:value="${customer?.dateOfBirth != null ? #dates.format(customer.dateOfBirth, 'yyyy-MM-dd') : ''}">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Giới tính
												</label>
												<div class="col-lg-6">
													<div class="mt-2">
														<label class="radio-inline mr-3">
															<input type="radio" name="gender"  value="true" th:checked="${customer.gender == true}" onclick="return false;"> Nam
														</label>
														<label class="radio-inline mr-3">
															<input type="radio" name="gender" value="false" th:checked="${customer.gender == false}" onclick="return false;"> Nữ
														</label>
													</div>
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-role">Vai trò</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-role" name="roles" th:field="*{customer.roles}" disabled>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_ADMIN}">Quản trị viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_USER}">Nhân viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_CUSTOMER}">Khách hàng</option>
													</select>
												</div>
											</div>
										</div>
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Tỉnh/Thành Phố
												</label>
												<div class="col-lg-6">
													<input th:value="${address?.province ?: ''}" type="text" readonly="" class="form-control" placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Quận/Huyện
												</label>
												<div class="col-lg-6">
													<input th:value="${address?.district ?: ''}" type="text" readonly="" class="form-control" placeholder="">
												</div>
											</div><div class="form-group row">
											<label class="col-lg-4 col-form-label" >Xã/Phường
											</label>
											<div class="col-lg-6">
												<input th:value="${address?.ward ?: ''}" type="text" readonly="" class="form-control" placeholder="">
												</div>
											</div>
											<!-- Địa chỉ cụ thể-->
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Số nhà/Ngõ/Đường</label>
												<div class="col-lg-6">
													<input type="text" class="form-control" readonly="" name="line" th:value="${address?.line ?: ''}" placeholder="">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-status">Trạng thái</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-status" name="status" th:field="*{customer.status}" >
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).ACTIVATED}" >Kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).NOT_ACTIVATED}" >Ngừng kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).DELETED}" >Đã nghỉ việc</option>
													</select>
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Ảnh đại diện</label>
												<div class="col-lg-6 d-flex flex-column align-items-center">
													<div class="input-group mb-3 px-2 py-2 rounded-pill bg-white shadow-sm" style="max-width: 300px; width: 100%;">
														<input id="upload" type="file" name="file" onchange="readURLAvatar(this);"
															   class="form-control border-0" accept="image/*" hidden>
														<label id="upload-label" for="upload" class="font-weight-light text-muted"></label>
														<div class="input-group-append w-100">
															<label for="upload" class="btn btn-light m-0 rounded-pill px-4 d-flex align-items-center justify-content-center w-100">
																<i class="fa fa-cloud-upload mr-2 text-muted"></i>
																<small class="text-uppercase font-weight-bold text-muted mb-0">
																	Chọn file
																</small>
															</label>
														</div>
													</div>
													<div class="image-area mt-4">
														<img id="avatarPreview" th:src="${customer.avatar}"
															 class="img-fluid rounded shadow-sm"
															 style="width: 120px; height: 120px; object-fit: cover; display: block; margin: 0 auto;">
													</div>
													<div th:if="${fileError}" class="text-danger mt-2">
														<p th:text="${fileError}"></p>
													</div>
												</div>
											</div>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		// Khi mở modal, cập nhật ảnh & tên file
		document.addEventListener("DOMContentLoaded", function () {
			let avatarPreview = document.getElementById("avatarPreview");
			let viewAvatarBtn = document.getElementById("viewAvatarBtn");
			// Kiểm tra nếu có ảnh thì hiển thị nút "Xem ảnh"
			if (avatarPreview.src && avatarPreview.style.display !== "none") {
				viewAvatarBtn.style.display = "inline-block";
			}
			// Khi mở modal, cập nhật ảnh & tên file
			document.querySelector("[data-target='#previewModal']").addEventListener("click", function () {
				let imgSrc = avatarPreview.src;
				let imgName = imgSrc.substring(imgSrc.lastIndexOf("/") + 1); // Lấy tên file từ URL
				document.getElementById("modalPreviewImage").src = imgSrc;
				document.getElementById("imageName").textContent = imgName; // Cập nhật tên ảnh
			});
		});
	</script>
</th:block>
</body>
</html>
