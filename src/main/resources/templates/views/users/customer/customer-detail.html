<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{views/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
	<meta charset="UTF-8">
	<title>Quản lý khách hàng</title>
	<th:block id="th-css"></th:block>
	<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
<th:block id="th-body">
	<div class="content-body">
		<div class="container-fluid">
			<!-- Add Project -->
			<!-- row -->
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">Khách hàng Chi Tiết</h4>
							<div>
								<a href="/customer-management" class="btn btn-primary mr-2">Quay lại</a>
								<!--<button type="submit" class="btn btn-primary">Lưu</button>-->
							</div>
						</div>
						<div class="card-body">
							<div class="form-validation">
								<form class="form-valide" method="post">
									<div class="row">
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">ID khách hàng</label>
												<div class="col-lg-6">
													<input th:value="${customer.id}" type="text" readonly=""  class="form-control"placeholder="Enter a username..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">Họ và tên</label>
												<div class="col-lg-6">
													<input th:value="${customer.fullName}" type="text" readonly=""  class="form-control" id="val-username" name="val-username" placeholder="Enter a username..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-email">Email
												</label>
												<div class="col-lg-6">
													<input th:value="${customer.email}" type="text" readonly="" class="form-control" id="val-email" name="val-email" placeholder="Your valid email..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Số điện thoại
												</label>
												<div class="col-lg-6">
													<input th:value="${customer.phoneNumber}" type="text" readonly="" class="form-control" id="val-sodienthoai" name="val-sodienthoai" placeholder="Your valid phone number..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Ngày sinh
												</label>
												<div class="col-lg-6">
													<input type="date" class="form-control" readonly th:value="${#dates.format(customer.dateOfBirth, 'yyyy-MM-dd')}">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Giới tính
												</label>
												<div class="col-lg-6">
													<div class="mt-2">
														<label class="radio-inline mr-3">
															<input type="radio" name="gender"  value="true" th:checked="${customer.gender == true}" onclick="return false;"> Nam
														</label>
														<label class="radio-inline mr-3">
															<input type="radio" name="gender" value="false" th:checked="${customer.gender == false}" onclick="return false;"> Nữ
														</label>
													</div>
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-role">Vai trò</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-role" name="roles" th:field="*{customer.roles}" disabled>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_ADMIN}">Quản trị viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_USER}">Nhân viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_CUSTOMER}">Khách hàng</option>
													</select>
												</div>
											</div>
										</div>
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Tỉnh/Thành Phố
												</label>
												<div class="col-lg-6">
													<input th:value="${address.province}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Quận/Huyện
												</label>
												<div class="col-lg-6">
													<input th:value="${address.district}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div><div class="form-group row">
											<label class="col-lg-4 col-form-label" >Xã/Phường
											</label>
											<div class="col-lg-6">
												<input th:value="${address.ward}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div>
											<!-- Địa chỉ cụ thể-->
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Số nhà/Ngõ/Đường</label>
												<div class="col-lg-6">
													<input type="text" class="form-control" readonly="" name="line" th:value="${address?.line}" placeholder="Nhập địa chỉ cụ thể...">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-status">Trạng thái</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-status" name="status" th:field="*{customer.status}" >
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).ACTIVATED}" >Kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).NOT_ACTIVATED}" >Ngừng kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).DELETED}" >Đã nghỉ việc</option>
													</select>
												</div>
											</div>
											<!-- Avatar Section -->
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Ảnh đại diện</label>
												<div class="col-lg-6 d-flex align-items-center position-relative">
													<!-- Avatar -->
													<div class="avatar-container position-relative" style="display: inline-block; position: relative;">
														<img id="avatarPreview"
															 th:src="@{'/assets/images/avatar/' + ${customer.avatar}}"
															 class="img-thumbnail"
															 alt="Avatar"
															 width="120" height="120"
															 style="border: 1px solid #ffffff; border-radius: 10px; object-fit: cover;">
														<!-- Nút Xem trước -->
														<div style="position: absolute; bottom: 5px; right: 5px; display: flex; gap: 5px;">
															<!-- Nút Xem trước (mờ, đặt trong ảnh) -->
															<button type="button" data-toggle="modal"  title="Xem ảnh" data-target="#previewModal"
																	style="width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
                        											border-radius: 50%; background-color: rgba(0, 0, 0, 0.5); color: white; border: none;">
																<i class="fas fa-eye"></i>
															</button>
														</div>
														<!-- Modal -->
														<div class="modal fade" id="previewModal" tabindex="-1" role="dialog" aria-labelledby="previewModalLabel" aria-hidden="true">
															<div class="modal-dialog" role="document">
																<div class="modal-content text-center" style=" width: 420px; height: auto;" >
																	<div class="modal-header">
																		<!-- Hiển thị tên ảnh -->
																		<p class="modal-title" id="imageName" th:text="${customer.avatar}"></p>

																		<!-- Nút đóng -->
																		<button type="button" class="close" data-dismiss="modal" aria-label="Close">
																			<span aria-hidden="true">&times;</span>
																		</button>
																	</div>
																	<div class="modal-body text-center">
																		<!-- Hiển thị ảnh với chiều rộng 80% modal -->
																		<img id="modalPreviewImage" src="" class="img-fluid" style="width: 100%; height: auto;">
																	</div>
																</div>
															</div>
														</div>
													</div>
												</div>
											</div>
										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>

<script>
	// Khi mở modal, cập nhật ảnh & tên file
	document.addEventListener("DOMContentLoaded", function () {
		document.querySelector("[data-target='#previewModal']").addEventListener("click", function () {
			let imgElement = document.getElementById("avatarPreview");
			let imgSrc = imgElement.src;
			let imgName = imgSrc.substring(imgSrc.lastIndexOf("/") + 1); // Lấy tên file từ URL

			document.getElementById("modalPreviewImage").src = imgSrc;
			document.getElementById("imageName").textContent = imgName; // Cập nhật tên ảnh
		});
	});
</script>
</th:block>
</body>
</html>
