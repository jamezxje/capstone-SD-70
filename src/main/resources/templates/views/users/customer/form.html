<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản lý khách hàng</title>
</head>
<body>
<h2 th:text="${customer.id} ? 'Chỉnh sửa khách hàng' : 'Thêm khách hàng'"></h2>
<form th:action="@{${customer.id} ? '/customers/update/' + ${customer.id} : '/customers/save'}" method="post" th:object="${customer}">
    <input type="hidden" th:field="*{id}" />
    <label>Họ và tên:</label>
    <input type="text" th:field="*{fullName}" required />
    <br/>
    <label>Email:</label>
    <input type="email" th:field="*{email}" required />
    <br/>
    <label>Số điện thoại:</label>
    <input type="text" th:field="*{phoneNumber}" required />
    <br/>
    <button type="submit">Lưu</button>
</form>
<a href="/customers">Quay lại danh sách</a>
</body>
</html>
