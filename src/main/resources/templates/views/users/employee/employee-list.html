<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{views/admin-dashboard/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
	<meta charset="UTF-8">
	<title>Quản lý Nhân Viên</title>
	<th:block id="th-css"></th:block>
</head>
<body>
<th:block id="th-body">
	<div id="toast-container" style="
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;">
	</div>
	<div class="content-body">
		<div class="container-fluid">
			<div class="card">
				<div class="card-header d-sm-flex d-block">
					<div class="mr-auto mb-sm-0 mb-3">
						<h4 class="card-title mb-2">Quản lý nhân viên</h4>
					</div>
					<a href="/staff-management" class="btn btn-info light mr-3">Tải lại</a>
					<a href="/staff-management/view-add" class="btn btn-info">+ Add Nhân Viên</a>
				</div>
				<div class="card-body">
					<div class="d-flex justify-content-between align-items-center w-100">
						<div class="d-flex justify-content-center w-100 gap-5" style="width: 100%;">
							<!-- Form tìm kiếm -->
							<form th:action="@{/staff-management}" method="get" class="d-flex gap-3 mr-5">
								<input type="text" name="keyword" class="form-control"
									   placeholder="Nhập tên, số điện thoại hoặc email..." th:value="${keyword}"
									   style="flex: 1; min-width: 300px;">
								<button type="submit" class="btn btn-primary">
									<i class="fa fa-search"></i> Tìm kiếm
								</button>
							</form>
							<!-- Form lọc trạng thái -->
							<form th:action="@{/staff-management}" method="get" class="d-flex align-items-center gap-3 ">
								<label class="mb-0 mr-1"><strong>Trạng thái:</strong></label>
								<select class="form-control form-select"
										name="status" style="flex: 1; min-width: 250px; border-radius: 5px; padding: 5px; cursor: pointer;"
										onchange="this.form.submit()">
									<option value="">Tất cả</option>
									<option value="ACTIVATED" th:selected="${status == 'ACTIVATED'}">Kích hoạt</option>
									<option value="NOT_ACTIVATED" th:selected="${status == 'NOT_ACTIVATED'}">Ngừng kích hoạt</option>
									<option value="DELETED" th:selected="${status == 'DELETED'}">Đã nghỉ việc</option>
								</select>
							</form>
						</div>
					</div>
				</div>
				<hr>
				<div class="card-body">
					<div class="table-responsive">
						<div id="ListDatatableView_wrapper" class="dataTables_wrapper no-footer"><table class="table style-1 dataTable no-footer" id="ListDatatableView" role="grid" aria-describedby="ListDatatableView_info">
							<thead>
							<tr role="row">
								<th class="sorting_asc" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-sort="ascending" aria-label="#: activate to sort column descending" style="width: 40.2px;">STT</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="CUSTOMER: activate to sort column ascending" style="width: 232.175px;">NHÂN VIÊN</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="COUNTRY: activate to sort column ascending" style="width: 100.55px;">SỐ ĐIỆN THOẠI</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="COUNTRY: activate to sort column ascending" style="width: 100.55px;">CCCD</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="DATE: activate to sort column ascending" style="width: 119.838px;">NGÀY SINH</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="COMPANY NAME: activate to sort column ascending" style="width: 100.075px;">GIỚI TÍNH</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="STATUS: activate to sort column ascending" style="width: 108.275px;">TRẠNG THÁI</th>
								<th class="sorting" tabindex="0" aria-controls="ListDatatableView" rowspan="1" colspan="1" aria-label="ACTION: activate to sort column ascending" style="width: 124.088px;">HÀNH ĐỘNG</th></tr>
							</thead>
							<tbody>
							<tr role="row" class="odd" th:each="employees, index : ${employees}">
								<td class="sorting_1">
									<h6 th:text="${index.count}"></h6>
								</td>
								<td>
									<div class="media style-1">
										<img th:src="${employees.avatar}" class="img-fluid mr-2" alt="">
										<div class="media-body">
											<h6 th:text="${employees.fullName != null ? employees.fullName : ''}"></h6>
											<span><a th:text="${employees.email != null ? employees.email : ''}" class="__cf_email__" data-cfemail="6c060304020803092c0b010d0500420f0301">[email&nbsp;protected]</a></span>
										</div>
									</div>
								</td>
								<td>
									<div>
										<h6 th:text="${employees.phoneNumber != null ? employees.phoneNumber : ''}"></h6>
									</div>
								</td>
								<td>
									<div>
										<h6 th:text="${employees.citizenIdentity != null ? employees.citizenIdentity : ''}"></h6>
									</div>
								</td>
								<td>
									<div>
										<h6 class="text-primary" th:text="${employees.dateOfBirth != null ? #dates.format(employees.dateOfBirth, 'dd/MM/yyyy') : ''}"></h6>
									</div>
								</td>
								<td>
									<div>
										<h6 class="text-primary" th:text="${employees.gender != null ? (employees.gender ? 'Nam' : 'Nữ') : ''}"></h6>
									</div>
								</td>
								<td><span class="badge badge-warning"  th:text="${employees.status == T(org.fpoly.capstone.entity.enum_status.UserStatus).ACTIVATED ? 'Kích hoạt'
								  : (employees.status == T(org.fpoly.capstone.entity.enum_status.UserStatus).NOT_ACTIVATED ? 'Chưa kích hoạt'
								  : 'Đã nghỉ việc')}"></span>
								</td>
								<td>
									<div class="d-flex action-button">
										<a th:href="@{/staff-management/detail/{id}(id=${employees.id})}" title="Chi tiết nhân viên" href="javascript:void(0);" class=" btn btn-xs px-2 light btn-danger">
											<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
												<path d="M12 14C8.686 14 6 16.686 6 20H18C18 16.686 15.314 14 12 14Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
												<path d="M12 12C14.209 12 16 10.209 16 8C16 5.791 14.209 4 12 4C9.791 4 8 5.791 8 8C8 10.209 9.791 12 12 12Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
											</svg>
										</a>
										<a th:href="@{/staff-management/view-update/{id}(id=${employees.id})}" title="Cập nhật nhân viên" href="javascript:void(0);" class="ml-2 btn btn-info btn-xs light px-2">
											<svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="">
												<path d="M17 3C17.2626 2.73735 17.5744 2.52901 17.9176 2.38687C18.2608 2.24473 18.6286 2.17157 19 2.17157C19.3714 2.17157 19.7392 2.24473 20.0824 2.38687C20.4256 2.52901 20.7374 2.73735 21 3C21.2626 3.26264 21.471 3.57444 21.6131 3.9176C21.7553 4.26077 21.8284 4.62856 21.8284 5C21.8284 5.37143 21.7553 5.73923 21.6131 6.08239C21.471 6.42555 21.2626 6.73735 21 7L7.5 20.5L2 22L3.5 16.5L17 3Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
											</svg>
										</a>
									</div>
								</td>
							</tr></tbody>
						</table>
							<div style="display: flex; justify-content: flex-end; align-items: center; gap: 8px;" class="dataTables_paginate paging_simple_numbers" id="ListDatatableView_paginate">
								<!-- Nút Previous -->
								<a class="paginate_button previous"
								   th:classappend="${currentPage == 1} ? 'disabled'"
								   th:href="${currentPage > 1} ? @{/staff-management(numPage=${currentPage - 1})} : '#'">
									<i class="fa fa-angle-double-left" aria-hidden="true"></i>
								</a>

								<!-- Hiển thị số trang -->
								<span>
									<a th:each="i : ${#numbers.sequence(1, totalPages)}" class="paginate_button"
									   th:classappend="${i == currentPage} ? 'current'"
									   th:href="@{/staff-management(numPage=${i})}" th:text="${i}"></a>
								</span>

								<!-- Nút Next -->
								<a class="paginate_button next"
								   th:classappend="${currentPage == totalPages} ? 'disabled'"
								   th:href="${currentPage < totalPages} ? @{/staff-management(numPage=${currentPage + 1})} : '#'">
									<i class="fa fa-angle-double-right" aria-hidden="true"></i>
								</a>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
	<script>
		function showToast(message) {
			const toastContainer = document.getElementById("toast-container");
			const toast = document.createElement("div");

			toast.innerHTML = `<i class="fas fa-check-circle" style="color: #28a745; margin-right: 10px;"></i> ${message}`;
			toast.style.cssText = `
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.5s, transform 0.5s ease-in-out;
            margin-bottom: 10px;
            position: relative;
            min-width: 250px;
        `;

			toastContainer.appendChild(toast);

			// Hiện thông báo (trượt từ phải vào)
			setTimeout(() => {
				toast.style.opacity = "1";
				toast.style.transform = "translateX(0)";
			}, 100);

			// Ẩn sau 3 giây (trượt ra phải)
			setTimeout(() => {
				toast.style.opacity = "0";
				toast.style.transform = "translateX(100%)";
				setTimeout(() => toast.remove(), 500);
			}, 3000);
		}

		// Hiển thị thông báo nếu có từ server
		document.addEventListener("DOMContentLoaded", function () {
			let successMessage = "[[${successMessage}]]";
			if (successMessage && successMessage.trim() !== "") {
				showToast(successMessage);
			}
		});
	</script>
</th:block>
</body>
</html>
