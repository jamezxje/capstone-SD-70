<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
	  th:replace="~{views/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
	<meta charset="UTF-8">
	<title>Quản lý Nhân Viên</title>
	<th:block id="th-css"></th:block>
</head>
<body>
<th:block id="th-body">
	<div class="content-body">
		<div class="container-fluid">
			<div class="row">
				<div class="col-lg-12">
					<div class="card">
						<div class="card-header">
							<h4 class="card-title">Nhân Viên Chi Tiết</h4>
							<div>
								<a href="/staff-management" class="btn btn-primary mr-2">Quay lại</a>
							</div>
						</div>
						<div class="card-body">
							<div class="form-validation">
								<form class="form-valide" method="post">
									<div class="row">
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">ID nhân viên</label>
												<div class="col-lg-6">
													<input th:value="${employee.id}" type="text" readonly=""  class="form-control"placeholder="Enter a username..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-username">Họ và tên</label>
												<div class="col-lg-6">
													<input th:value="${employee.fullName}" type="text" readonly=""  class="form-control" id="val-username" name="val-username" placeholder="Enter a username..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-email">Email
												</label>
												<div class="col-lg-6">
													<input th:value="${employee.email}" type="text" readonly="" class="form-control" id="val-email" name="val-email" placeholder="Your valid email..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Số điện thoại
												</label>
												<div class="col-lg-6">
													<input th:value="${employee.phoneNumber}" type="text" readonly="" class="form-control" id="val-sodienthoai" name="val-sodienthoai" placeholder="Your valid phone number..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-sodienthoai">Ngày sinh
												</label>
												<div class="col-lg-6">
													<input type="date" class="form-control" readonly th:value="${#dates.format(employee.dateOfBirth, 'yyyy-MM-dd')}">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-cccd">Căn cước công dân
												</label>
												<div class="col-lg-6">
													<input th:value="${employee.citizenIdentity}" type="text" readonly="" class="form-control" id="val-cccd" name="val-cccd" placeholder="Your valid CCCD..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Giới tính
												</label>
												<div class="col-lg-6">
													<div class="mt-2">
														<label class="radio-inline mr-3">
															<input type="radio" name="gender"  value="true" th:checked="${employee.gender == true}" onclick="return false;"> Nam
														</label>
														<label class="radio-inline mr-3">
															<input type="radio" name="gender" value="false" th:checked="${employee.gender == false}" onclick="return false;"> Nữ
														</label>
													</div>
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-role">Vai trò</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-role" name="roles" th:field="*{employee.roles}" disabled>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_ADMIN}">Quản trị viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_USER}">Nhân viên</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_CUSTOMER}">Khách hàng</option>
													</select>
												</div>
											</div>
										</div>
										<div class="col-xl-6">
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Tỉnh/Thành Phố
												</label>
												<div class="col-lg-6">
													<input th:value="${address.province}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" >Quận/Huyện
												</label>
												<div class="col-lg-6">
													<input th:value="${address.district}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div><div class="form-group row">
											<label class="col-lg-4 col-form-label" >Xã/Phường
											</label>
											<div class="col-lg-6">
												<input th:value="${address.ward}" type="text" readonly="" class="form-control" placeholder="Your valid phone number..">
												</div>
											</div>
											<!-- Địa chỉ cụ thể-->
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Số nhà/Ngõ/Đường</label>
												<div class="col-lg-6">
													<input type="text" class="form-control" readonly="" name="line" th:value="${address?.line}" placeholder="Nhập địa chỉ cụ thể...">
												</div>
											</div>
											<div class="form-group row">
												<label class="col-lg-4 col-form-label" for="val-status">Trạng thái</label>
												<div class="col-lg-6">
													<select class="form-control" id="val-status" name="status" th:field="*{employee.status}" >
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).ACTIVATED}" >Kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).NOT_ACTIVATED}" >Ngừng kích hoạt</option>
														<option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).DELETED}" >Đã nghỉ việc</option>
													</select>
												</div>
											</div>

											<!-- Modal Bootstrap -->
											<div class="form-group row">
												<label class="col-lg-4 col-form-label">Ảnh đại diện</label>
												<div class="col-lg-6 d-flex align-items-center">
													<!-- Avatar -->
													<div class="avatar-container position-relative"
														 style="width: 120px; height: 120px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center;">
														<img id="avatarPreview"
															 th:src="${employee.avatar != null ? '/assets/images/avatar/' + employee.avatar : ''}"
															 class="img-thumbnail"
															 alt="Avatar"
															 width="120" height="120"
															 style="object-fit: cover; display: none;"
															 th:style="${employee.avatar != null} ? 'display: block;' : 'display: none;'">
													</div>
													<!-- Nút Xem ảnh -->
													<button title="Xem ảnh" type="button" id="viewAvatarBtn" class="btn btn-sm btn-dark ml-3"
															data-toggle="modal" data-target="#previewModal" style="display: none;">
														<svg viewBox="64 64 896 896" focusable="false" data-icon="eye" width="1em" height="1em" fill="currentColor" aria-hidden="true">
															<path d="M942.2 486.2C847.4 286.5 704.1 186 512 186c-192.2 0-335.4 100.5-430.2 300.3a60.3 60.3 0 000 51.5C176.6 737.5 319.9 838 512 838c192.2 0 335.4-100.5 430.2-300.3 7.7-16.2 7.7-35 0-51.5zM512 766c-161.3 0-279.4-81.8-362.7-254C232.6 339.8 350.7 258 512 258c161.3 0 279.4 81.8 362.7 254C791.5 684.2 673.4 766 512 766zm-4-430c-97.2 0-176 78.8-176 176s78.8 176 176 176 176-78.8 176-176-78.8-176-176-176zm0 288c-61.9 0-112-50.1-112-112s50.1-112 112-112 112 50.1 112 112-50.1 112-112 112z"></path>
														</svg>
													</button>
												</div>
											</div>

											<!-- Modal -->
											<div class="modal fade" id="previewModal" tabindex="-1" role="dialog" aria-labelledby="previewModalLabel" aria-hidden="true">
												<div class="modal-dialog" role="document">
													<div class="modal-content">
														<div class="modal-header">
															<p class="modal-title" id="imageName" th:text="${employee.avatar}"></p>
															<button type="button" class="close" data-dismiss="modal" aria-label="Close">&times;</button>
														</div>
														<div class="modal-body text-center">
															<img id="modalPreviewImage" src="" class="img-fluid" style="width: 100%;">
														</div>
													</div>
												</div>
											</div>

										</div>
									</div>
								</form>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script>
		// Khi mở modal, cập nhật ảnh & tên file
		document.addEventListener("DOMContentLoaded", function () {
			let avatarPreview = document.getElementById("avatarPreview");
			let viewAvatarBtn = document.getElementById("viewAvatarBtn");

			// Kiểm tra nếu có ảnh thì hiển thị nút "Xem ảnh"
			if (avatarPreview.src && avatarPreview.style.display !== "none") {
				viewAvatarBtn.style.display = "inline-block";
			}

			// Khi mở modal, cập nhật ảnh & tên file
			document.querySelector("[data-target='#previewModal']").addEventListener("click", function () {
				let imgSrc = avatarPreview.src;
				let imgName = imgSrc.substring(imgSrc.lastIndexOf("/") + 1); // Lấy tên file từ URL

				document.getElementById("modalPreviewImage").src = imgSrc;
				document.getElementById("imageName").textContent = imgName; // Cập nhật tên ảnh
			});
		});
	</script>
</th:block>
</body>
</html>
