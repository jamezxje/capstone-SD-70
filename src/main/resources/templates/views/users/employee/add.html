                                            </div>
                                            <div class="form-group row">

                                                    <input type="text" class="form-control" id="phoneNumber" th:field="*{phoneNumber}" placeholder="Nhập số điện thoại">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="dateOfBirth">Ngày sinh</label>
                                                <div class="col-lg-6">
                                                    <input type="date" class="form-control" id="dateOfBirth" th:field="*{dateOfBirth}">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="citizenIdentity">Căn cước công dân</label>
                                                <div class="col-lg-6">
                                                    <input type="text" class="form-control" id="citizenIdentity" th:field="*{citizenIdentity}" placeholder="Nhập CCCD">
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label">Giới tính</label>
                                                <div class="col-lg-6">
                                                    <div class="mt-2">
                                                        <label class="radio-inline mr-3">
                                                            <input type="radio" th:field="*{gender}" value="true"> Nam
                                                        </label>
                                                        <label class="radio-inline mr-3">
                                                            <input type="radio" th:field="*{gender}" value="false"> Nữ
                                                        </label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-group row">
                                                <label class="col-lg-4 col-form-label" for="roles">Vai trò</label>
                                                <div class="col-lg-6">
                                                    <select class="form-control" id="roles" th:field="*{roles}">
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_ADMIN}">Quản trị viên</option>
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_USER}">Nhân viên</option>
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserRole).ROLE_CUSTOMER}">Khách hàng</option>
                                                    </select>

                                            <!--                                                </div>-->
                                            <!--                                            </div>-->

                                                <label class="col-lg-4 col-form-label" for="status">Trạng thái</label>

                                                    <select class="form-control" id="status" th:field="*{status}">
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).ACTIVATED}">Kích hoạt</option>
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).NOT_ACTIVATED}">Chưa kích hoạt</option>
                                                        <option th:value="${T(org.fpoly.capstone.entity.enum_status.UserStatus).DELETED}">Đã nghỉ việc</option>
                                                    </select>
                                                </div>
