<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">
<head>
  <meta charset="UTF-8">
  <title>Product Management</title>
  <th:block id="th-css">
    <link rel="stylesheet" th:href="@{/assets/admin-dashboard/vendors/datatables.net-bs4/dataTables.bootstrap4.css}">
    <link rel="stylesheet" th:href="@{/css/product-management/product/add-new-product.css}">
    <link rel="stylesheet" type="text/css" th:href="@{/assets/admin-dashboard/js/select.dataTables.min.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-fileinput/css/fileinput.min.css" rel="stylesheet">
  </th:block>
</head>
<body>

<th:block id="th-body">
  <div class="content-body">
    <div class="container-fluid">
      <div class="row page-titles mx-0">
        <div class="col-sm-6 p-md-0">
          <div class="welcome-text">
            <h4>Chào mừng quay lại!</h4>
            <span>Sửa sản phẩm</span>
          </div>
        </div>
        <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
          <ol class="breadcrumb">
            <!--            <li class="breadcrumb-item"><a href="javascript:void(0)"></a></li>-->
            <!--            <li class="breadcrumb-item active"><a href="javascript:void(0)"></a></li>-->
          </ol>
        </div>
      </div>
      
      <form class="form-update-product-detail"
            th:action="@{/dashboard/product-management/product-detail/update}"
            th:object="${productDetailModel}" method="post" enctype="multipart/form-data"
            onsubmit="removeCommasBeforeSubmit()">
        
        <input type="hidden" th:field="*{id}"/>
        <!--Thong tin san pham start-->
        <div class="row">
          <div class="col-lg-3">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Ảnh bìa</h4>
              </div>
              <div class="card-body">
                <div class="basic-form">
                  <div class="form-row">
                    <div class="form-group col-md-12">
                      <div class="input-group mb-3 px-2 py-2 rounded-pill bg-white shadow-sm">
                        <input id="upload" th:field="*{featureImage}" type="file" name="featureImage"
                               onchange="readURL(this);"
                               class="form-control border-0">
                        <label id="upload-label" for="upload" class="font-weight-light text-muted">Chọn ảnh</label>
                        <div class="input-group-append">
                          <label for="upload" class="btn btn-light m-0 rounded-pill px-4"> <i
                              class="fa fa-cloud-upload mr-2 text-muted"></i><small
                              class="text-uppercase font-weight-bold text-muted">Chọn ảnh</small></label>
                        </div>
                      </div>
                      
                      <!-- Uploaded image area-->
                      <p class="font-italic text-grey text-center">Ảnh được upload sẽ được hiển thị bên dưới.</p>
                      <!-- Thumbnail -->
                      <div class="image-area mt-4">
                        <img id="imageResult" th:src="${productDetailModel.featureImageUrl}"
                             alt="Existing Thumbnail" class="img-fluid rounded shadow-sm mx-auto d-block">
                      </div>
                    
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          
          <div class="col-lg-9">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Thông tin sản phẩm</h4>
              </div>
              <div class="card-body">
                <div class="basic-form">
                  <div class="form-row">
                    <div class="form-group col-md-4">
                      <label for="productId">Sản phẩm <span class="text-danger">*</span> </label>
                      <select id="productId" name="productId" class="form-control" th:field="*{productId}"
                              required>
                        <option value="" selected>Chọn sản phẩm</option>
                        <option th:each="product : ${products}"
                                th:value="${product.id}"
                                th:text="${product.name}">
                        </option>
                      </select>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="brandId">Thương hiệu<span class="text-danger">*</span> </label>
                      <select id="brandId" name="brandId" class="form-control" th:field="*{brandId}"
                              required>
                        <option value="" selected>Chọn thương hiệu</option>
                        <option th:each="brand : ${brands}"
                                th:value="${brand.id}"
                                th:text="${brand.name}">
                        </option>
                      </select>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="materialId">Chất liệu<span class="text-danger">*</span> </label>
                      <select id="materialId" name="materialId" class="form-control" th:field="*{materialId}"
                              required>
                        <option value="" selected>Chọn chất liệu</option>
                        <option th:each="material : ${materials}"
                                th:value="${material.id}"
                                th:text="${material.name}">
                        </option>
                      </select>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="colorId">Màu sắc<span class="text-danger">*</span> </label>
                      <select id="colorId" name="colorId" class="form-control" th:field="*{colorId}"
                              required>
                        <option value="" selected>Chọn màu sắc</option>
                        <option th:each="color : ${colors}"
                                th:value="${color.id}"
                                th:text="${color.name}">
                        </option>
                      </select>
                    </div>
                    <div class="form-group col-md-4">
                      <label for="sizeId">Size<span class="text-danger">*</span> </label>
                      <select id="sizeId" name="sizeId" class="form-control" th:field="*{sizeId}"
                              required>
                        <option value="" selected>Chọn size</option>
                        <option th:each="size : ${sizes}"
                                th:value="${size.id}"
                                th:text="${size.name}">
                        </option>
                      </select>
                    </div>
                    
                    <div class="form-group col-md-4">
                      <label for="gender">Size<span class="text-danger">*</span> </label>
                      <select id="gender" name="gender" class="form-control" th:field="*{gender}"
                              required>
                        <option value="" selected>Chọn giới tính</option>
                        <option
                            th:each="gender : ${T(org.fpoly.capstone.entity.enum_status.Gender).values()}"
                            th:value="${gender}" th:text="${gender}">
                        </option>
                      </select>
                    </div>
                    
                    <div class="form-group col-md-4">
                      <label>Status<span class="text-danger">*</span> </label>
                      <select class="form-control"
                              id="status" name="status" th:field="*{status}">
                        <option
                            th:each="statusOpt : ${T(org.fpoly.capstone.entity.enum_status.ProductVariantStatus).values()}"
                            th:value="${statusOpt}">
                        <span
                            th:if="${statusOpt == T(org.fpoly.capstone.entity.enum_status.ProductVariantStatus).DANG_SU_DUNG}">ĐANG SỬ DỤNG</span>
                          <span
                              th:if="${statusOpt == T(org.fpoly.capstone.entity.enum_status.ProductVariantStatus).NGUNG_SU_DUNG}">NGỪNG SỬ DỤNG</span>
                          <span
                              th:if="${statusOpt == T(org.fpoly.capstone.entity.enum_status.ProductVariantStatus).HET_SAN_PHAM}">HẾT SẢN PHẨM</span>
                        </option>
                      </select>
                    
                    </div>
                    
                    <div class="form-group col-md-4">
                      <label for="quantity">Số lượng <span class="text-danger">*</span></label>
                      <input id="quantity" type="number" th:field="*{quantity}" name="quantity" class="form-control"
                             placeholder="" required min="0">
                      <div th:if="${#fields.hasErrors('quantity')}" class="text-danger">
                        <p th:errors="*{quantity}"></p>
                      </div>
                    </div>
                    
                    
                    <div class="form-group col-md-4">
                      <label for="price">Giá tiền (VND) <span class="text-danger">*</span></label>
                      <input id="price" type="text" name="price" th:field="*{price}"
                             class="form-control product-detail-price"
                             oninput="formatPrice(this)"
                             placeholder="" required>
                    </div>
                    
                    <div class="form-group col-md-12">
                      <label for="description">Mô tả (tùy chọn)</label>
                      <textarea id="description" name="description" rows="5" class="form-control"
                                th:field="*{description}"
                                placeholder="Mô tả sản phẩm "> </textarea>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!--Thong tin san pham end-->
        
        <!-- Album san pham start -->
        <div class="row mt-3">
          <div class="col-lg-12">
            <div class="card">
              <div class="card-header">
                <h4 class="card-title">Album sản phẩm</h4>
              </div>
              <div class="card-body">
                <div class="basic-form">
                  <div class="form-row">
                    <div class="form-group col-md-12">
                      <label for="productMediaGallery">Image gallery</label>
                      <input id="productMediaGallery" name="images" type="file" class="form-control" multiple
                             th:field="*{images}"
                             data-preview-file-type="text">
                    </div>
                  </div>
                  
                  <!-- Display Images from the imagesUrl list -->
                  <div class="form-group col-md-12">
                    <label>Existing Images</label>
                    <div class="d-flex flex-wrap">
                      <div th:each="imageUrl : ${productDetailModel.imagesUrl}" class="image-thumbnail mx-2 my-2">
                        <img th:src="@{${imageUrl}}" alt="Product Image" class="img-thumbnail"
                             style="width: 150px; height: 150px;">
                      </div>
                    </div>
                  </div>
                  
                  <div class="d-flex justify-content-end">
                    <button id="btn-update-product" class="btn btn-primary mt-3">Lưu</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <!-- Album san pham end -->
      
      </form>
    </div>
  </div>

</th:block>

<!-- JS Section -->
<th:block id="th-js">
  <script th:src="@{/assets/admin-dashboard/vendor/jquery-validation/jquery.validate.min.js}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-fileinput/js/fileinput.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap-fileinput/js/locales/vi.js"></script>
  <script>
    (function ($) {
      "use strict"
      
      jQuery(".form-update-product-detail").validate({
        ignore: [],
        errorClass: "invalid-feedback animated fadeInUp",
        errorElement: "div",
        errorPlacement: function (e, a) {
          jQuery(a).parents(".form-group").append(e)
        },
        highlight: function (e) {
          jQuery(e).closest(".form-group").removeClass("is-invalid").addClass("is-invalid")
        },
        success: function (e) {
          jQuery(e).closest(".form-group").removeClass("is-invalid"), jQuery(e).remove()
        },
      });
      
    })(jQuery);
    
    ClassicEditor
        .create(document.querySelector('#description'), {
          toolbar: [
            'ckbox', 'imageUpload', '|', 'heading', '|', 'undo', 'redo', '|', 'bold', 'italic', '|',
            'blockQuote', 'indent', 'link', '|', 'bulletedList', 'numberedList'
          ],
        })
        .catch(error => {
          console.error(error);
        });
    
    function readURL(input) {
      if (input.files && input.files[0]) {
        var reader = new FileReader();
        
        reader.onload = function (e) {
          $('#imageResult')
              .attr('src', e.target.result);
        };
        reader.readAsDataURL(input.files[0]);
      }
    }
    
    $(function () {
      $('#upload').on('change', function () {
        readURL(input);
      });
    });
    
    /*  ==========================================
        SHOW UPLOADED IMAGE NAME
    * ========================================== */
    var input = document.getElementById('upload');
    var infoArea = document.getElementById('upload-label');
    
    input.addEventListener('change', showFileName);
    
    function showFileName(event) {
      var input = event.srcElement;
      var fileName = input.files[0].name;
      infoArea.textContent = 'File name: ' + fileName;
    }
    
    $("#productMediaGallery").fileinput({
      language: "vi",
      uploadAsync: false,
      showUpload: false,
      previewFileType: 'image',
      initialPreviewAsData: false, // allows you to set a raw markup
      overwriteInitial: false,
    });
  
  </script>
  <script>
    function formatCurrency(event) {
      let input = event.target;
      let value = input.value;
      
      // Xóa tất cả ký tự không phải là số
      value = value.replace(/\D/g, '');
      
      // Định dạng thành tiền tệ với dấu phân cách hàng nghìn
      let formattedValue = new Intl.NumberFormat('vi-VN').format(value);
      
      // Cập nhật lại giá trị trong input
      input.value = formattedValue;
    }
    
    // window.onload = function () {
    //   const priceInput = document.getElementById('price');
    //   const priceValue = parseFloat(priceInput.value);
    //   const formattedPrice = priceValue.toLocaleString('de-DE');
    //   priceInput.value = formattedPrice;
    // };
    
    function formatPrice(input) {
      // Remove non-numeric characters
      let value = input.value.replace(/\D/g, '');
      
      // Format the number with commas
      value = value.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      
      // Set the formatted value back into the input field
      input.value = value;
    }
    
    function removeCommasBeforeSubmit() {
      const inputs = document.querySelectorAll('.product-detail-price');
      inputs.forEach(input => {
        input.value = input.value.replace(/,/g, ''); // Remove commas before submission
      });
    }
    
    window.onload = function () {
      const priceInput = document.getElementById('price');
      const priceValue = parseFloat(priceInput.value);
      const formattedPrice = priceValue.toLocaleString('de-DE');
      priceInput.value = formattedPrice;
    };
  </script>
</th:block>

</body>
</html>
