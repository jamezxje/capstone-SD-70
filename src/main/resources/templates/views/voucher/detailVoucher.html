<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">

<head>
  <meta charset="utf-8">
  <th:block id="th-css">
  </th:block>

</head>

<body>
<th:block id="th-body">
  <div class="content-body">
    <div class="container-fluid">
      <div class="row">
        <div class="col-lg-12">
          <div class="card">
            <div class="card-header">
              <h4 class="card-title">Khuyến mại chi tiết</h4>
            </div>
            <div class="card-body">
              <div class="form-validation">

                <form class="needs-validation"
                      th:object="${voucher}" method="post">

                  <div class="row">

                    <div class="col-xl-6">

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="name">Tên Voucher</label>
                        <div class="col-lg-6">
                          <input type="text" class="form-control" id="name" th:value="${voucher.name}" placeholder="Nhập tên..." oninput="validateName()" disabled>
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="value">Số tiền (VND)</label>
                        <div class="col-lg-6">
                          <input type="text" class="form-control" id="value" name="value" th:value="${formattedValue}" placeholder="Nhập số tiền..." disabled oninput="formatCurrency(event)">
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="quantity">Số lượng</label>
                        <div class="col-lg-6">
                          <input type="number" class="form-control" id="quantity" th:value="${voucher.quantity}" placeholder="Nhập số lượng..." disabled min="1" max="10000">
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="createAt">Ngày tạo:</label>
                        <div class="col-lg-6">
                          <input
                                  type="text"
                                  class="form-control"
                                  id="createAt"
                                  name="createAt"
                                  th:value="${#dates.format(voucher.createDate, 'dd/MM/yyyy HH:mm')}"
                                  disabled>

                        </div>
                        </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="status">Trạng thái</label>
                        <div class="col-lg-6">
                          <select class="form-control" id="status" name="status" disabled="disabled">
                            <option th:each="status : ${status}"
                                    th:text="${status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).ACTIVE ? 'Đang hoạt động' :
                (status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).INACTIVE ? 'Chưa hoạt động' : 'Hết hạn')}"
                                    th:value="${status}"
                                    th:selected="*{status} == ${status}" disabled="disabled"></option>
                          </select>
                        </div>
                      </div>

                    </div>

                    <div class="col-xl-6">

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="id">ID</label>
                        <div class="col-lg-6">
                       <input type="text" class="form-control" id="id" th:value="${voucher.id}" required disabled="disabled">
                        </div>
                      </div>


                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="startDate">Ngày bắt đầu</label>
                        <div class="col-lg-6">
                          <input type="datetime-local" class="form-control" id="startDate" name="startDate"
                                 th:value="${#temporals.format(startDate, 'yyyy-MM-dd''T''HH:mm')}" disabled>                          <div class="invalid-feedback">Ngày bắt đầu phải trước ngày kết thúc.</div>
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="endDate">Ngày kết thúc</label>
                        <div class="col-lg-6">
                          <input type="datetime-local" class="form-control" id="endDate" name="endDate"
                                 th:value="${#temporals.format(endDate, 'yyyy-MM-dd''T''HH:mm')}" disabled>
                        </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label" for="minimumBill">Hóa đơn tối thiểu</label>
                        <div class="col-lg-6">
                          <input type="text" class="form-control" id="minimumBill" oninput="formatCurrency(event)"
                                 th:value="${miniBill}" name="miniBill" placeholder="Nhập hóa đơn tối thiểu..." disabled>                         </div>
                      </div>

                      <div class="form-group row">
                        <label class="col-lg-4 col-form-label"  for="lastModifiedDate">Ngày sửa cuối:</label>
                        <div class="col-lg-6">
                          <input
                                  type="text"
                                  class="form-control"
                                  id="lastModifiedDate"
                                  name="lastModifiedDate"
                                  th:value="${#temporals.format(voucher.lastModifiedDate, 'dd/MM/yyyy HH:mm')}"
                                  disabled>
                        </div>
                      </div>

                    </div>


              </div>


                  <div style="text-align: right; margin-top: 20px">
                    <button class="btn btn-primary mr-2" type="button" onclick="window.history.back();">Quay lại</button>
                  </div>
                </form>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
    <script th:src="@{/assets/js/voucher/voucherUpdate.js}"></script>
  </div>
</th:block>
