<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">

<head>
  <meta charset="utf-8">
  <th:block id="th-css">
  </th:block>

</head>

<body>
<th:block id="th-body">
  <div class="content-body">
    <div class="container-fluid">
      <!-- Add Project -->
      <div class="modal fade" id="addProjectSidebar">
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Create Project</h5>
              <button type="button" class="close" data-dismiss="modal"><span>&times;</span>
              </button>
            </div>
            <div class="modal-body">
              <form>
                <div class="form-group">
                  <label class="text-black font-w500">Project Name</label>
                  <input type="text" class="form-control">
                </div>
                <div class="form-group">
                  <label class="text-black font-w500">Deadline</label>
                  <input type="date" class="form-control">
                </div>
                <div class="form-group">
                  <label class="text-black font-w500">Client Name</label>
                  <input type="text" class="form-control">
                </div>
                <div class="form-group">
                  <button type="button" class="btn btn-primary">CREATE</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <div class="row page-titles mx-0">
        <div class="col-sm-6 p-md-0">
          <div class="welcome-text">
            <h4>Hi, welcome back!</h4>
            <p class="mb-0">Tạo voucher</p>
          </div>
        </div>
        <div class="col-sm-6 p-md-0 justify-content-sm-end mt-2 mt-sm-0 d-flex">
          <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="javascript:void(0)">Voucher</a></li>
            <li class="breadcrumb-item active"><a href="javascript:void(0)">Thêm Voucher</a></li>
          </ol>
        </div>
      </div>
      <div class="row">
        <div class="col-xl-12">
          <div class="card">
            <div class="card-body">
              <div class="row">
                
                <div class="col-lg-8 order-lg-1">
                  <h4 class="mb-3">Tạo voucher</h4>
                  <form class="needs-validation" novalidate=""
                        th:action="@{/dashboard/product-management/voucher/create}" th:object="${voucher}"
                        method="post">
                    <div class="row">
                      
                      <div class="col-md-6 mb-3">
                        <label for="name">Tên</label>
                        <input type="text" class="form-control" id="name" th:field="*{name}" placeholder=""
                               required="required">
                        <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="text-danger error"></span>
                      </div>
                    </div>
                    
                    <div class="mb-3">
                      <label for="value">Số tiền</label>
                      <input type="text" class="form-control" id="value" th:field="*{value}" required="required"
                             oninput="formatCurrency(event)">
                      <span th:if="${#fields.hasErrors('value')}" th:errors="*{value}" class="text-danger error"></span>
                    </div>
                    
                    <div class="mb-3">
                      <label for="quantity">Số lượng</label>
                      <input type="number" class="form-control" id="quantity" th:field="*{quantity}"
                             required="required">
                      <span th:if="${#fields.hasErrors('quantity')}" th:errors="*{quantity}"
                            class="text-danger error"></span>
                    </div>
                    
                    <div class="mb-3">
                      <label for="startDate">Ngày bắt đầu</label>
                      <input type="datetime-local" class="form-control" id="startDate" th:field="*{startDate}"
                             required="required">
                      <span th:if="${#fields.hasErrors('startDate')}" th:errors="*{startDate}"
                            class="text-danger error"></span>
                    </div>
                    
                    <div class="mb-3">
                      <label for="endDate">Ngày kết thúc</label>
                      <input type="datetime-local" class="form-control" id="endDate" th:field="*{endDate}"
                             required="required">
                      <span th:if="${#fields.hasErrors('endDate')}" th:errors="*{endDate}"
                            class="text-danger error"></span>
                    </div>
                    
                    
                    <div class="mb-3">
                      <label for="status">Trạng thái</label>
                      <select class="form-control" id="status" name="status" required="">
                        <option value="">Chọn trạng thái</option>
                        
                        <option th:each="status : ${status}"
                                th:value="${status}"
                                th:text="${status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).ACTIVE ? 'Đang hoạt động' :
                            (status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).INACTIVE ? 'Chưa hoạt động' : 'Hết hạn')}">
                        
                        </option>
                      
                      </select>
                      <div class="invalid-feedback">
                        Please select a valid status.
                      </div>
                    </div>
                    
                    
                    <hr class="mb-4">
                    
                    <button class="btn btn-primary btn-lg btn-block" type="submit">Gửi</button>
                  </form>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    function formatCurrency(event) {
      let input = event.target;
      let value = input.value;
      
      // Xóa tất cả ký tự không phải là số
      value = value.replace(/\D/g, '');
      
      // Định dạng thành tiền tệ với dấu phân cách hàng nghìn
      let formattedValue = new Intl.NumberFormat('vi-VN').format(value);
      
      // Cập nhật lại giá trị trong input
      input.value = formattedValue;
    }
  
  </script>
</th:block>
</body>

</html>
