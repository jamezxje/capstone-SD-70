<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/root_layout::rootLayoutFragment(~{::#th-css}, null, ~{::#th-body})}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login Page</title>
    <th:block id="th-css">
        <link rel="icon" type="image/png" sizes="16x16" href="/assets/admin-dashboard/images/favicon.png">
        <link th:href="@{/assets/admin-dashboard/vendor/bootstrap-select/dist/css/bootstrap-select.min.css}"
              rel="stylesheet">
        <link th:href="@{/assets/admin-dashboard/css/style.css}" rel="stylesheet">
    </th:block>
</head>
<body>

<th:block id="th-body">
    <div id="toast-container" style="
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;">
    </div>
    <div class="vh-100">
        <div class="authincation h-100">
            <div class="container h-100">
                <div class="row justify-content-center h-100 align-items-center">
                    <div class="col-md-6">
                        <div class="authincation-content">
                            <div class="row no-gutters">
                                <div class="col-xl-12">
                                    <div class="auth-form">
                                        <div class="text-center mb-3">
                                            <img src="/assets/admin-dashboard/images/logo-full.png" alt="">
                                        </div>
                                        <h4 class="text-center mb-4">Đăng nhập tài khoản</h4>
                                        <div th:if="${param.error}">
                                            <div class="alert alert-danger">email hoặc mật khẩu sai</div>
                                        </div>
                                        <div th:if="${param.logout}">
                                            <div class="alert alert-success">Bạn đã đăng xuất</div>
                                        </div>
                                        <form th:action="@{/auth/login}" method="post">
                                            <div class="form-group">
                                                <label class="text-label">Email</label>
                                                <div class="input-group">
                                                    <div class="input-group-prepend ">
                                                        <span class="input-group-text bg-primary text-white"><i class="fa fa-envelope"></i></span>
                                                    </div>
                                                    <input type="email" name="username" class="form-control" placeholder="Nhập email..." value="">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="text-label">Mật khẩu</label>
                                                <div class="input-group transparent-append">
                                                    <div class="input-group-prepend">
                                                        <span class="input-group-text bg-primary text-white"> <i class="fa fa-lock"></i> </span>
                                                    </div>
                                                    <input type="password" name="password" class="form-control" placeholder="Nhập mật khẩu..." value="">
                                                    <div class="input-group-append show-pass ">
                                                    <span class="input-group-text bg-primary text-white">
														<i class="fa fa-eye-slash"></i>
														<i class="fa fa-eye"></i>
                                                    </span>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-row d-flex justify-content-between mt-4 mb-2">
                                                <div class="form-group">
                                                    <div class="custom-control custom-checkbox ml-1">
                                                        <input type="checkbox" class="custom-control-input" id="basic_checkbox_1">
                                                        <label class="custom-control-label" for="basic_checkbox_1">Ghi nhớ tài khoản</label>
                                                    </div>
                                                </div>
                                                <div class="form-group">
                                                    <a th:href="@{/auth/forgot-password}">Quyên mật khẩu</a>
                                                </div>
                                            </div>
                                            <div class="text-center">
                                                <button type="submit" class="btn btn-primary btn-block">Đăng nhập</button>
                                            </div>
                                        </form>
                                        <div class="new-account mt-3">
                                            <p>Bạn chưa có tài khoản? <a class="text-primary" th:href="@{/auth/register}">Đăng ký</a></p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <script>
        document.querySelector('.show-pass').addEventListener('click', function () {
            const passwordInput = document.querySelector('input[name="password"]');
            const eyeIcon = this.querySelector('.fa-eye');
            const eyeSlashIcon = this.querySelector('.fa-eye-slash');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.style.display = 'inline';
                eyeSlashIcon.style.display = 'none';
            } else {
                passwordInput.type = 'password';
                eyeIcon.style.display = 'none';
                eyeSlashIcon.style.display = 'inline';
            }
        });
    </script>
    <script>
        function showToast(message) {
            const toastContainer = document.getElementById("toast-container");
            const toast = document.createElement("div");

            toast.innerHTML = `<i class="fas fa-check-circle" style="color: #28a745; margin-right: 10px;"></i> ${message}`;
            toast.style.cssText = `
            background-color: #d4edda;
            color: #155724;
            border-left: 5px solid #28a745;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            display: flex;
            align-items: center;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            opacity: 0;
            transform: translateX(100%);
            transition: opacity 0.5s, transform 0.5s ease-in-out;
            margin-bottom: 10px;
            position: relative;
            min-width: 250px;
        `;

            toastContainer.appendChild(toast);

            // Hiện thông báo (trượt từ phải vào)
            setTimeout(() => {
                toast.style.opacity = "1";
                toast.style.transform = "translateX(0)";
            }, 100);

            // Ẩn sau 3 giây (trượt ra phải)
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(100%)";
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        // Hiển thị thông báo nếu có từ server
        document.addEventListener("DOMContentLoaded", function () {
            let successMessage = "[[${successMessage}]]";
            if (successMessage && successMessage.trim() !== "") {
                showToast(successMessage);
            }
        });
    </script>
</th:block>
</body>
</html>
