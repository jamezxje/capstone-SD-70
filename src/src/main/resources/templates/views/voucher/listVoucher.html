<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org"
      th:replace="~{views/admin-dashboard/layout/app_layout::appLayoutFragment(~{::#th-css}, ~{::#th-js}, ~{::#th-body})}">

<head>
  <meta charset="utf-8">
  <th:block id="th-css">
    <style>
      /* General Body Styles */
      body {
        font-family: 'Arial', sans-serif;
        background-color: #f8f9fc;
        color: #333;
        margin: 0;
        padding: 0;
      }
      .container-fluid {
        margin-top: 30px;
      }


form {
  margin-left: 20px;
  padding: 0;
  width: 100%;
  margin-top:10px;

}

/* Cải thiện các nhóm form */
.form-group {
  margin-bottom: 1.5rem;
  width: 100%;
}

/* Cải tiến label của các trường input */
.form-group label {
  font-weight: bold;
  margin-bottom: 0.5rem;
  display: block;
  color: #333;
}

/* Thiết kế cho các input và select trong form */
.form-control {
  border-radius: 8px;
  border: 1px solid #ccc;
  width: 100%;
  font-size: 1rem;
  box-sizing: border-box;
  background-color: #fff;
  transition: border-color 0.3s ease, box-shadow 0.3s ease;
}

.form-control:focus {
  border-color: #007bff;
  box-shadow: 0 0 8px rgba(0, 123, 255, 0.5);
}

/* Cải thiện nút tìm kiếm */
.btn-search {
  background-color: #ff8000;
  color: white;
  padding: 10px 15px; /* Giảm padding để nút nhỏ hơn */
  border-radius: 5px;
  border: none;
  margin-top: 30px;
  margin-bottom: 30px;
  cursor: pointer;
  font-size: 0.9rem; /* Giảm kích thước chữ */
  transition: background-color 0.3s ease, transform 0.2s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  margin-left: 10px;
}

.btn-search:hover {
  background-color: #0056b3;
  transform: scale(1.05);
}

.btn-search:active {
  background-color: #004085;
  transform: scale(0.98);
}

/* Hiệu ứng cho biểu tượng tìm kiếm */
.btn-search svg {
  margin-right: 6px; /* Giảm khoảng cách giữa biểu tượng và văn bản */
  fill: white;
  width: 16px; /* Giảm kích thước biểu tượng */
  height: 16px; /* Giảm kích thước biểu tượng */
}
/* Cải thiện sự linh hoạt của các cột trong form */
.form-group.col-6 {
  flex: 1 1 48%;
}

@media (max-width: 768px) {
  .form-group.col-6 {
    flex: 1 1 100%;
  }
}

/* Responsive design cho các trường input */
input[type="text"], select, input[type="date"] {
  padding: 12px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 1rem;
  width: 100%;
  box-sizing: border-box;
  background-color: #fff;
}

/* Responsive design cho form */
@media (max-width: 576px) {
  .form-group {
    width: 100%;
  }

  .btn-search {
    width: 100%; /* Chiếm toàn bộ chiều rộng trên thiết bị nhỏ */
    margin-left: 0;
  }
}



      /* Danh sách Phiếu Giảm Giá */
     /* Định dạng chung cho card-header */
.card-header {
  background-color: #ff6f00; /* Màu nền cam đậm */
  color: #fff; /* Màu chữ trắng */
  padding: 15px 20px; /* Khoảng cách trong của card */
  border-radius: 8px; /* Bo góc cho card header */
  display: flex; /* Sử dụng flexbox để căn chỉnh các phần tử */
  justify-content: space-between; /* Căn giữa các phần tử theo chiều ngang */
  align-items: center; /* Căn giữa theo chiều dọc */
  box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1); /* Thêm bóng đổ cho phần đầu */
}

/* Tiêu đề của card */
.card-title {
  font-size: 1.6rem; /* Tăng kích thước font cho tiêu đề */
  margin-bottom: 0; /* Loại bỏ khoảng cách dưới của h4 */
  font-weight: 600; /* Làm chữ đậm */
}

/* Định dạng cho nút Thêm voucher */
.btn-orange {
  background-color: #ff6f00; /* Nền cam */
  color: #fff; /* Màu chữ trắng */
  border: 2px solid #ff6f00; /* Đường viền cam */
  padding: 8px 20px; /* Khoảng cách bên trong nút */
  border-radius: 4px; /* Bo góc cho nút */
  font-weight: 600; /* Chữ đậm cho nút */
  transition: all 0.3s ease; /* Hiệu ứng chuyển màu khi hover */
}

.btn-orange:hover {
  background-color: #e65100; /* Màu nền khi hover sẽ là cam đậm hơn */
  color: #fff; /* Màu chữ trắng khi hover */
  border-color: #e65100; /* Đổi màu viền khi hover */
}

/* Responsive design cho màn hình nhỏ */
@media (max-width: 768px) {
  .card-header {
    flex-direction: column; /* Đặt các phần tử theo chiều dọc khi màn hình nhỏ */
    align-items: flex-start; /* Căn chỉnh các phần tử về phía trái */
  }

  .card-title {
    margin-bottom: 10px; /* Khoảng cách giữa tiêu đề và nút */
  }

  .btn-orange {
    width: 100%; /* Đặt nút chiếm toàn bộ chiều rộng của card header khi màn hình nhỏ */
    text-align: center; /* Căn giữa chữ trong nút */
  }
}

      /* Responsive Design */
      @media (max-width: 768px) {
        .form-search {
          flex-direction: column;
        }

        .form-search .form-group {
          margin-right: 0;
          margin-bottom: 10px;
        }

        .form-search input,
        .form-search select,
        .btn-search {
          width: 100%;
        }
      }
      /* General Table Styles */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      table-layout: fixed;
    }

    th, td {
      padding: 12px;
      text-align: left;
      font-size: 14px;
      color: #333;

    }

    th {
      background-color: #ff6f00;
      color: white;
      font-weight: bold;
    }

   th:first-child, td:first-child {
  width: 50px; /* Hoặc giá trị tùy chỉnh để làm nhỏ ô STT */
  text-align: center; /* Căn giữa văn bản */
}
th:nth-last-child(2), td:nth-last-child(2) {
  width: 120px; /* Giới hạn chiều rộng của cột */
  /* Căn giữa văn bản */
  overflow: hidden; /* Ẩn phần văn bản thừa */
  white-space: nowrap; /* Ngừng xuống dòng */
  text-overflow: ellipsis; /* Hiển thị dấu ba chấm nếu văn bản quá dài */
}
th:nth-child(5), td:nth-child(5) {
  /* Các thuộc tính CSS bạn muốn áp dụng */
  width:50px;
  overflow: hidden;
   white-space: nowrap; /* Ngừng xuống dòng */
  text-overflow: ellipsis;
}
/* Cài đặt cho các ô <td> có nội dung dài */
td {
  max-width: 150px; /* Giới hạn chiều rộng của ô */
  overflow: hidden; /* Ẩn phần văn bản vượt quá chiều rộng của ô */
  text-overflow: ellipsis; /* Hiển thị dấu ba chấm khi văn bản quá dài */
  white-space: normal;
}
/* Cài đặt cho các ô <td> có nội dung dài */
td.limit-text {
  max-width: 150px; /* Giới hạn chiều rộng của ô */
  overflow: hidden; /* Ẩn phần văn bản vượt quá chiều rộng của ô */
  text-overflow: ellipsis; /* Hiển thị dấu ba chấm khi văn bản quá dài */
 white-space: normal;
}


    tr:nth-child(even) {
      background-color: #f2f2f2;
    }

    tr:hover {
      background-color: #f1f1f1;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 5px;
      font-size: 12px;
      color: white;
    }

    .badge-success {
      background-color: #28a745;
    }

    .badge-warning {
      background-color: #ffc107;
    }

    .badge-danger {
      background-color: #dc3545;
    }

    /* Action Buttons */
    .btn-action {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      padding: 8px 12px;
      border-radius: 5px;
      background-color: #17a2b8;
      color: white;
      text-decoration: none;
      margin: 5px;
    }

    .btn-action:hover {
      background-color: #138496;
    }

    .btn-action svg {
      width: 16px;
      height: 16px;
      margin-right: 5px;
    }

    /* Table Scroll for Small Screens */


    .table-responsive {
      overflow-x: auto;
      margin-top: 20px;
    }

    /* Responsive Styling */
    @media (max-width: 768px) {
      th, td {
        font-size: 12px;
        padding: 8px;
      }

      .btn-action {
        font-size: 12px;
        padding: 6px 10px;
      }
    }

    @media (max-width: 480px) {
      th, td {
        font-size: 10px;
        padding: 6px;
      }

      .btn-action {
        font-size: 10px;
        padding: 4px 8px;
      }
    }

/* Căn chỉnh nút pagination đẹp và có hiệu ứng hover */
.pagination {
  display: flex;
  justify-content: center; /* Canh giữa */
  margin: 20px 0;
  padding: 0;
}

.page-item {
  margin: 0 4px;
  border-radius: 5px; /* Góc bo tròn */


}

.page-link {
  padding: 68x 15px; /* Tăng kích thước cho nút */
  font-size: 12px;
  color: #007bff; /* Màu chữ của nút */
  background-color: #fff; /* Màu nền của nút */
  border: 1px solid #ddd; /* Đường viền mờ cho các nút */
  border-radius: 5px;
  transition: background-color 0.3s ease, color 0.3s ease; /* Hiệu ứng chuyển màu mượt mà */
}

.page-link:hover {
  background-color: #007bff; /* Màu nền khi hover */
  color: #fff; /* Màu chữ khi hover */
}

.page-item.disabled .page-link {
  background-color: #f8f9fa; /* Màu nền cho nút disabled */
  color: #6c757d; /* Màu chữ khi disabled */
  pointer-events: none; /* Vô hiệu hóa nút khi disabled */
}

.page-item.active .page-link {
  background-color: #007bff; /* Màu nền cho trang hiện tại */
  color: #fff; /* Màu chữ cho trang hiện tại */
  pointer-events: none; /* Vô hiệu hóa click vào trang hiện tại */
}

/* Responsive - Giảm kích thước nút trên thiết bị nhỏ */
@media (max-width: 576px) {
  .page-link {
    padding: 6px 12px; /* Giảm padding trên các thiết bị nhỏ */
    font-size: 14px; /* Giảm kích thước chữ */
  }
}

/* Thêm hiệu ứng khi hover và active trên các nút */
.page-link:focus {
  outline: none;
  box-shadow: 0 0 0 2px rgba(0, 123, 255, 0.5); /* Thêm hiệu ứng khi focus vào nút */
}

      .btn-white {
    background-color: white;
    color: #FF5722; /* Màu cam cho chữ (hoặc màu bạn muốn) */
    border: 2px solid #FF5722; /* Màu cam cho viền */
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 4px;
    text-align: center;
    text-decoration: none;
  }

  .btn-white:hover {
    background-color: #FF5722; /* Màu cam khi hover */
    color: white; /* Chữ trắng khi hover */
  }

    </style>
  </th:block>
</head>

<body>
<th:block id="th-body">

  <div class="content-body">
    <div class="container-fluid">
      <div class="card">

        <form th:action="@{/dashboard/product-management/voucher/search}" method="get" class="">
          <div class="row d-flex">
          <div class="col-4 form-group">
            <label for="name">Tên:</label>
            <input type="text" class="form-control" id="name" name="name" placeholder="Nhập tên tìm kiếm">
          </div>


          <div class="col-4 form-group">
            <label for="status">Trạng thái:</label>
            <select class="form-control" id="status" name="status">
              <option value="">Chọn trạng thái</option>
              <option th:each="status : ${status}"
                      th:value="${status}"
                      th:text="${status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).ACTIVE ? 'Đang hoạt động' :
                            (status == T(org.fpoly.capstone.entity.enum_status.VoucherStatus).INACTIVE ? 'Chưa hoạt động' : 'Hết hạn')}">
              </option>
            </select>

          </div>

            <div class="col-4 form-group">
              <label for="createAt">Ngày tạo</label>
              <input type="date" class="form-control" id="createAt" name="createAt" placeholder="Nhập ngày tìm kiếm">
            </div>

          <div class="col-4 form-group">
            <label for="startDate">Ngày bắt đầu</label>
            <input type="date" class="form-control" id="startDate" name="startDate" placeholder="Nhập ngày bắt đầu tìm kiếm">
          </div>


          <div class="col-4 form-group">
            <label for="endDate">Ngày kết thúc</label>
            <input type="date" class="form-control" id="endDate" name="endDate" placeholder="Nhập ngày kết thúc tìm kiếm">
          </div>




          <button type="submit" class="btn-search">

            <svg width="20" height="20" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M15 16L19 20M17 14C18.5 12.25 18.5 9.25 17 7.5C15.5 5.75 12.5 5.75 11 7.5C9.5 9.25 9.5 12.25 11 14C12.5 15.75 15.5 15.75 17 14Z" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            </svg>
            Tìm kiếm
          </button>
          </div>
        </form>

      </div>


      <div class="card">

        <!-- Tìm kiếm -->



        <!-- Tiêu đề "Danh Sách Phiếu Giảm Giá" -->
        <div class="card-header d-sm-flex d-block">
          <h4 class="card-title mb-2 text-light">Danh sách phiếu giảm giá</h4>
          <a th:href="@{/dashboard/product-management/voucher/create}" class="btn btn-orange">+ Thêm voucher</a>
        </div>


        <div class="card-body">
          <!-- Table Content -->
          <div class="table-responsive">
            <script>
              // Định dạng tiền tệ cho giá trị voucher khi trang tải
               document.addEventListener("DOMContentLoaded", function() {
                   const valueElements = document.querySelectorAll('.voucher-value');
                   valueElements.forEach(function (element) {
              // Lấy giá trị và loại bỏ các ký tự không phải số, bao gồm dấu phân cách hàng nghìn
                   const value = parseFloat(element.innerText.replace(/[^\d.-]/g, ''));
              // Đảm bảo giá trị là số hợp lệ
                if (!isNaN(value)) {
              // Làm tròn xuống đến 2 chữ số thập phân
                const roundedValue = Math.floor(value * 100) / 100;
              // Định dạng số theo kiểu tiền tệ Việt Nam
              element.innerText = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(roundedValue);
          }
        });
        });
            </script>


            <table class="table table-bordered table-hover" id="ListDatatableView" border="1">
              <thead>
              <tr>
                <th>STT</th>
                <th>Code</th>
                <th>Tên phiếu giảm giá</th>
                <th>Ngày tạo</th>
                <th>Số lượng</th>
                <th>Số tiền</th>
                <th>Ngày bắt đầu</th>
                <th>Ngày kết thúc</th>
                <th>Trạng thái</th>
                <th>Hành động</th>
              </tr>
              </thead>
              <tbody>
              <tr th:each="voucher,iterStat : ${voucherPage}">
                <td><div th:text="${iterStat.index + 1}"></div></td>
                <td class="limit-text"><div th:text="${voucher.code}"></div></td>
                <td class="limit-text"><div th:text="${voucher.name}"></div></td>
                <td><div th:text="${#dates.format(voucher.createDate, 'dd/MM/yyyy HH:mm')}"></div></td>
                <td><div th:text="${voucher.quantity}"></div></td>
                <td class="voucher-value limit-text" th:text="${voucher.value}"></td>
                <td><div th:text="${#temporals.format(voucher.startDate, 'dd/MM/yyyy HH:mm')}"></div></td>
                <td><div th:text="${#temporals.format(voucher.endDate, 'dd/MM/yyyy HH:mm')}"></div></td>
                <td class="limit-text">
                  <h6 class="text-primary">
                <span class="badge" th:classappend="${voucher.status == voucher.status.ACTIVE ? 'badge-success' : (voucher.status == voucher.status.INACTIVE ? 'badge-warning' : 'badge-danger')}">
                  <span th:text="${voucher.status == voucher.status.ACTIVE ? 'Hoạt động' : (voucher.status == voucher.status.INACTIVE ? 'Chưa hoạt động' : 'Hết hạn')}"></span>
                </span>
                  </h6>
                </td>
                <td>
                  <div class="d-flex action-button">
                    <!-- Button to open the modal -->
                    <a th:href="@{/dashboard/product-management/voucher/detail/{id}(id=${voucher.id})}"
                       class="btn btn-info btn-xs light px-2" title="Chi tiết Voucher">
                      <!-- Biểu tượng SVG của ngôi nhà -->
                      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 3L2 12H5V20H9V14H15V20H19V12H22L12 3Z"
                              stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                      </svg>
                    </a>


                    <!-- Modal for Voucher Details -->

                    <a th:href="@{/dashboard/product-management/voucher/{id}(id=${voucher.id})}" class="btn btn-info btn-xs light px-2 ml-3">
                      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M17 3C17.2626 2.73735 17.5744 2.52901 17.9176 2.38687C18.2608 2.24473 18.6286 2.17157 19 2.17157C19.3714 2.17157 19.7392 2.24473 20.0824 2.38687C20.4256 2.52901 20.7374 2.73735 21 3C21.2626 3.26264 21.471 3.57444 21.6131 3.9176C21.7553 4.26077 21.8284 4.62856 21.8284 5C21.8284 5.37143 21.7553 5.73923 21.6131 6.08239C21.471 6.42555 21.2626 6.73735 21 7L7.5 20.5L2 22L3.5 16.5L17 3Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
                      </svg>

                    </a>
                    <!--                    <a th:href="@{/dashboard/product-management/voucher/delete/{id}(id=${voucher.id})}"-->
                    <!--                       class="ml-2 btn btn-xs px-2 light btn-danger"-->
                    <!--                       onclick="return confirm('Bạn có chắc chắn muốn xóa voucher này?');">-->
                    <!--                      <svg width="20" height="20" viewbox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">-->
                    <!--                        <path d="M3 6H5H21" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>-->
                    <!--                        <path d="M8 6V4C8 3.46957 8.21071 2.96086 8.58579 2.58579C8.96086 2.21071 9.46957 2 10 2H14C14.5304 2 15.0391 2.21071 15.4142 2.58579C15.7893 2.96086 16 3.46957 16 4V6M19 6V20C19 20.5304 18.7893 21.0391 18.4142 21.4142C18.0391 21.7893 17.5304 22 17 22H7C6.46957 22 5.96086 21.7893 5.58579 21.4142C5.21071 21.0391 5 20.5304 5 20V6H19Z" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>-->
                    <!--                      </svg>-->
                    <!--                    </a>-->
                  </div>
                </td>
              </tr>
              </tbody>
            </table>

            <!-- Modal to Show Voucher Details -->

            <th:block th:if="${!voucherPage.isEmpty()}">
              <nav aria-label="Pagination" class="d-flex justify-content-end">
                <ul class="pagination">
                  <!-- Nút Previous -->
                  <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/dashboard/product-management/voucher/list(numPage=${currentPage != null && currentPage > 1 ? currentPage - 1 : 1})}" aria-label="Previous">
                      <span aria-hidden="true" style="color: black;">&laquo;</span>
                    </a>
                  </li>

                  <!-- Hiển thị tối đa 3 trang -->
                  <li th:each="i : ${#numbers.sequence(currentPage > 1 ? currentPage - 1 : 1, currentPage + 1 <= totalPages ? currentPage + 1 : totalPages)}"
                      th:classappend="${i == currentPage} ? 'active'">
                    <a class="page-link" th:href="@{/dashboard/product-management/voucher/list(numPage=${i})}" th:text="${i}"></a>
                  </li>

                  <!-- Nút Next -->
                  <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/dashboard/product-management/voucher/list(numPage=${currentPage != null && currentPage < totalPages ? currentPage + 1 : totalPages})}" aria-label="Next">
                      <span aria-hidden="true" style="color: black;">&raquo;</span>
                    </a>
                  </li>
                </ul>
              </nav>


            </th:block>
          </div>
        </div>
      </div>
    </div>
  </div>
</th:block>
<th:block>


</th:block>
</body>


</html>
